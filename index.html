<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI v61.6 - DATA MES ANO FIX</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--dark:#111827;--purple:#6D5BFF;--bg:#F6F7FB;--border:#E5E7EB}
*{box-sizing:border-box;margin:0;padding:0}body{background:var(--bg);font-family:Inter,sans-serif;color:#111827;padding-bottom:90px}
.top{position:sticky;top:0;z-index:100;background:var(--dark);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;height:60px}
.topLeft{display:flex;align-items:center;gap:10px}.topTitle b{font-size:13px;font-weight:700}.topTitle small{font-size:11px;color:#FBBF24;font-weight:600}
.btnHome{background:var(--purple);color:#fff;border:none;padding:7px 14px;border-radius:20px;font-weight:700;font-size:11px;cursor:pointer}
.dot{font-size:10px;color:#22C55E;display:flex;align-items:center;gap:6px}.dot i{width:6px;height:6px;background:#22C55E;border-radius:50%;display:inline-block}
#takiMenu{position:fixed;inset:0;z-index:999;display:none}#takiMenu.open{display:block}#takiMenuBg{position:absolute;inset:0;background:rgba(0,0,0,.5)}
#takiMenuPanel{position:absolute;top:0;left:0;bottom:0;width:84%;max-width:330px;background:#fff;overflow-y:auto}
.takiMenuHead{padding:18px 16px;font-weight:800;font-size:13px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between}
.takiMenuItem{padding:14px 16px;border-bottom:1px solid #F3F4F6;cursor:pointer;font-weight:600;font-size:13px;color:#374151}
.takiMenuItem:active{background:#F3F4F6}
.cardMes{background:#fff;margin:10px;border:1px solid var(--border);border-radius:18px;padding:16px;text-align:center}
.cardMes b{font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:14px}
.arrow{width:44px;height:44px;background:#F9FAFB;border:1px solid var(--border);border-radius:12px;font-size:26px;cursor:pointer;font-weight:800}
.dataRow{display:flex;gap:8px;justify-content:center;margin-top:14px}
.dataChip{border:1px solid var(--border);background:#F9FAFB;border-radius:12px;padding:10px 14px;min-width:88px;text-align:center}
.dataChip b{font-size:10px;color:#6B7280;display:block}.dataChip span{font-size:14px;font-weight:800;display:block;margin-top:2px}
.filters{display:flex;gap:6px;justify-content:center;margin:12px}.filters button{border:1px solid var(--border);background:#fff;color:#6B7280;padding:8px 14px;border-radius:20px;font-weight:600;font-size:12px;cursor:pointer}
.filters button.active{background:var(--purple);color:#fff;border-color:var(--purple)}
.contador{margin:0 10px;background:#fff;border:1px solid var(--border);border-radius:12px;padding:10px;text-align:center;font-size:11px;color:#6B7280}
.dayHeader{background:#111827;color:#fff;padding:10px 14px;border-radius:10px;margin:16px 10px 10px;font-weight:700;font-size:12px}
.eventCard{background:#fff;margin:0 10px 14px;border:1px solid var(--border);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.badgeShows{background:var(--purple);color:#fff;padding:4px 10px;border-radius:20px;font-size:11px;font-weight:700;position:absolute;top:12px;right:12px}
.eventTitle{font-weight:800;font-size:15px}
.slot{display:flex;justify-content:space-between;font-size:13px;background:#F9FAFB;padding:10px 12px;border-radius:10px;border:1px solid #F3F4F6}
.eventSub{font-size:13px;font-weight:700;background:#F5F3FF;padding:12px;border-radius:10px;border:1px solid #EDE9FE}
.eventSub small{color:#6B7280;font-size:11px;font-weight:500}
.eventActions{display:flex;gap:10px;margin-top:4px}.btnEdit,.btnDel{flex:1;border:1px solid #E5E7EB;background:#fff;padding:10px;border-radius:10px;font-weight:700;font-size:12px;cursor:pointer}
.btnEdit{color:#374151}.btnDel{color:#DC2626;background:#FEF2F2;border-color:#FECACA}
.plus{position:fixed;bottom:86px;right:14px;width:56px;height:56px;background:var(--purple);color:#fff;border:none;border-radius:16px;font-size:28px;box-shadow:0 6px 18px rgba(109,91,255,.4);z-index:90;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;gap:8px;padding:12px;border-top:1px solid var(--border);z-index:200;border-radius:20px 20px 0 0}
.bottom button{flex:1;border:1px solid var(--border);padding:12px;border-radius:12px;font-weight:700;font-size:11px;cursor:pointer;background:#fff;color:#6B7280}
.bottom button.btnZap{background:#111827;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:500;padding:14px}.modal.open{display:flex}
.modalBox{background:#fff;border-radius:16px;width:100%;max-width:420px;padding:18px;max-height:92vh;overflow-y:auto;border:1px solid var(--border)}
.inp{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px;margin:6px 0;font-size:13px}
.btnPrimary{width:100%;padding:12px;border:none;border-radius:10px;font-weight:700;background:var(--purple);color:#fff;cursor:pointer;margin-top:8px}
.btnGhost{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;font-weight:600;background:#fff;color:#6B7280;cursor:pointer;margin-top:6px}
.musCheck{display:flex;justify-content:space-between;padding:10px 12px;border:1px solid var(--border);border-radius:10px;margin:5px 0;cursor:pointer}
.musCheck.on{border-color:var(--purple);background:#F5F3FF}
.turnoCard{border:1px solid var(--border);border-radius:12px;padding:12px;margin:8px 0}
.timeRow{display:flex;gap:8px;margin-top:6px}.timeRow input{flex:1}
.totalBox{background:#111827;color:#fff;padding:12px 14px;border-radius:12px;margin-top:10px;display:flex;justify-content:space-between;font-weight:700}
</style>
</head>
<body>
<div class="top"><div class="topLeft"><span onclick="openMenu()" style="font-size:26px;cursor:pointer">☰</span><div class="topTitle"><b>AGENDA DO MES</b><br><small>TAKI SOM</small><div class="dot"><i></i><span>Permanente</span></div></div></div><button class="btnHome" onclick="location.href='index.html'">HOME</button></div>

<div id="takiMenu"><div id="takiMenuBg" onclick="closeMenu()"></div><div id="takiMenuPanel">
<div class="takiMenuHead"><span>TAKI MENU</span><span onclick="closeMenu()" style="cursor:pointer;background:#F3F4F6;padding:6px 10px;border-radius:8px">✕</span></div>
<div class="takiMenuItem" onclick="setView('dia');closeMenu()">📋 Agenda do dia</div>
<div class="takiMenuItem" onclick="setView('semana');closeMenu()">🗓 Semana</div>
<div class="takiMenuItem" onclick="setView('mes');closeMenu()">📅 Mês</div>
<div class="takiMenuItem" onclick="setView('ano');closeMenu()">🗓 Ano</div>
<div class="takiMenuItem" onclick="exportZap(true);closeMenu()">🏠 COM valor</div>
<div class="takiMenuItem" onclick="exportZap(false);closeMenu()">🎤 SEM valor</div>
<div class="takiMenuItem" onclick="openMusicos();closeMenu()">🎤 Cadastrar músicos</div>
<div class="takiMenuItem" onclick="openCasas();closeMenu()">🏠 Cadastrar casas</div>
<div class="takiMenuItem" onclick="closeMenu()">🚪 Fechar</div>
</div></div>

<div class="cardMes">
<b><button class="arrow" onclick="mudaMes(-1)">‹</button><span id="labelMes">MES DE OUTUBRO<br>DE 2026</span><button class="arrow" onclick="mudaMes(1)">›</button></b>
<div class="dataRow">
<div class="dataChip"><b>DIA</b><span id="chipDia">24</span></div>
<div class="dataChip"><b>MÊS</b><span id="chipMes">OUTUBRO</span></div>
<div class="dataChip"><b>ANO</b><span id="chipAno">2026</span></div>
</div>
</div>

<div class="filters">
<button onclick="setView('hoje')" id="fHoje">Hoje</button>
<button onclick="setView('dia')" id="fDia">Dia</button>
<button onclick="setView('semana')" id="fSemana">Semana</button>
<button class="active" onclick="setView('mes')" id="fMes">Mês</button>
<button onclick="setView('ano')" id="fAno">Ano</button>
</div>
<div class="contador" id="contador"></div>
<div id="lista"></div>
<button class="plus" onclick="abreNovo()">+</button>

<div class="bottom">
<button class="btnZap" onclick="escolheZap()">💬 ZAP</button>
<button onclick="exportNormal()">📄 NORMAL</button>
<button onclick="exportFolha()">📋 FOLHA</button>
<button onclick="exportPdf()">📑 PDF</button>
</div>

<div class="modal" id="modZap"><div class="modalBox">
<b>Enviar</b><br><br>
<button class="btnPrimary" onclick="exportZap(true);closeM('modZap')">🏠 COM VALOR - casa</button>
<button class="btnPrimary" style="background:#111827;margin-top:8px" onclick="exportZap(false);closeM('modZap')">🎤 SEM VALOR - músico</button>
<button class="btnGhost" onclick="closeM('modZap')">Cancelar</button>
</div></div>

<div class="modal" id="modEdit"><div class="modalBox">
<b id="modTitle">Novo cronograma</b><br><br>
<label style="font-size:11px;font-weight:700;color:#6B7280">DATA - DIA / MÊS / ANO</label>
<input id="eData" type="date" class="inp">
<select id="eProjeto" class="inp"><option>P1 - EDILL</option><option>P2 - TAKI</option><option>TAKI SOM</option></select>
<select id="eCasa" class="inp"><option value="">Casa</option></select>
<div class="turnoCard"><label><input type="checkbox" id="chkAlmoco" checked onchange="calc()"> ☀️ Almoço</label><div class="timeRow"><input id="eIniA" type="time" class="inp" value="12:30"><input id="eFimA" type="time" class="inp" value="15:30"></div></div>
<div class="turnoCard"><label><input type="checkbox" id="chkJanta" checked onchange="calc()"> 🌙 Janta</label><div class="timeRow"><input id="eIniJ" type="time" class="inp" value="19:00"><input id="eFimJ" type="time" class="inp" value="22:00"></div></div>
<div id="listaMusicosEvento" style="max-height:150px;overflow-y:auto;margin:8px 0"></div>
<div class="totalBox"><span id="txtShows">2 shows</span><span id="totalCache">R$ 0</span></div>
<div style="display:flex;gap:8px;margin-top:12px"><button class="btnPrimary" style="flex:1" onclick="salva()">Salvar</button><button class="btnGhost" style="flex:1" onclick="closeM('modEdit')">Cancelar</button></div>
</div></div>

<div class="modal" id="modMusicos"><div class="modalBox"><b>Músicos</b><input id="musNome" class="inp" placeholder="Nome"><input id="musValor" type="number" class="inp" placeholder="R$ por show"><button class="btnPrimary" onclick="addMusico()">+ Adicionar</button><div id="listaMusicos" style="margin-top:10px"></div><button class="btnGhost" onclick="closeM('modMusicos')">Fechar</button></div></div>
<div class="modal" id="modCasas"><div class="modalBox"><b>Casas</b><input id="casaNome" class="inp" placeholder="Nome"><button class="btnPrimary" onclick="addCasa()">Adicionar</button><div id="listaCasas" style="margin-top:10px"></div><button class="btnGhost" onclick="closeM('modCasas')">Fechar</button></div></div>

<script>
// SIMPLES - SEM INDEXEDDB QUE QUEBRA
var eventos = JSON.parse(localStorage.getItem('taki_agenda')||'[]');
var casas = JSON.parse(localStorage.getItem('taki_casas')||'[]');
var musicos = JSON.parse(localStorage.getItem('taki_musicos')||'[]');
var mesAtual = new Date(2026,9,24);
var view = 'mes';
var editId = null;
var selMusicos = [];

if(eventos.length==0 && localStorage.getItem('taki_primeira')==null){
  eventos=[{id:1,data:"2026-10-24",projeto:"P1 - EDILL",casa:"P1 - EDILL",slots:[{tipo:"almoco",inicio:"12:30",fim:"15:30"},{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{id:1,nome:"Ediu",valor:150}],valor:300}];
  musicos=[{id:1,nome:"Ediu",valor:150}];
  localStorage.setItem('taki_primeira','1');
}

function save(){
  localStorage.setItem('taki_agenda',JSON.stringify(eventos));
  localStorage.setItem('taki_casas',JSON.stringify(casas));
  localStorage.setItem('taki_musicos',JSON.stringify(musicos));
}
function openMenu(){document.getElementById('takiMenu').classList.add('open')}
function closeMenu(){document.getElementById('takiMenu').classList.remove('open')}
function closeM(id){document.getElementById(id).classList.remove('open')}
function setView(v){
  view=v;
  document.querySelectorAll('.filters button').forEach(function(b){b.classList.remove('active')});
  var m={hoje:'fHoje',dia:'fDia',semana:'fSemana',mes:'fMes',ano:'fAno'};
  if(m[v]) document.getElementById(m[v]).classList.add('active');
  render();
}
function render(){
  var mes=mesAtual.getMonth(),ano=mesAtual.getFullYear(),dia=mesAtual.getDate();
  document.getElementById('labelMes').innerHTML='MES DE '+mesAtual.toLocaleDateString('pt-BR',{month:'long'}).toUpperCase()+'<br>DE '+ano;
  document.getElementById('chipDia').innerText=dia;
  document.getElementById('chipMes').innerText=mesAtual.toLocaleDateString('pt-BR',{month:'long'}).toUpperCase();
  document.getElementById('chipAno').innerText=ano;
  var lista=document.getElementById('lista');lista.innerHTML='';
  var filtrados=eventos.filter(function(ev){
    var d=new Date(ev.data+'T00:00:00');
    if(view=='mes') return d.getMonth()==mes && d.getFullYear()==ano;
    if(view=='dia' || view=='hoje'){ var alvo=view=='hoje'?new Date():mesAtual; return ev.data==alvo.toISOString().slice(0,10) }
    if(view=='semana'){ var ini=new Date(mesAtual); ini.setDate(mesAtual.getDate()-mesAtual.getDay()); var fim=new Date(ini); fim.setDate(ini.getDate()+6); return d>=ini && d<=fim }
    if(view=='ano') return d.getFullYear()==ano;
    return true;
  }).sort(function(a,b){return a.data.localeCompare(b.data)});
  var grupos={};
  filtrados.forEach(function(ev){ if(!grupos[ev.data]) grupos[ev.data]=[]; grupos[ev.data].push(ev) });
  Object.keys(grupos).sort().forEach(function(data){
    var d=new Date(data+'T00:00:00');
    var titulo=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
    lista.innerHTML+='<div class="dayHeader">'+titulo+'</div>';
    grupos[data].forEach(function(ev){
      var slotsHtml='';
      (ev.slots||[]).forEach(function(s){ var ico=s.tipo=='almoco'?'☀️':'🌙'; var label=s.tipo=='almoco'?'Almoço':'Janta'; slotsHtml+='<div class="slot"><b>'+ico+' '+label+'</b><span>'+s.inicio+' - '+s.fim+'</span></div>' });
      var qtd=ev.slots?ev.slots.length:1;
      var nomes=(ev.musicos||[]).map(function(m){return m.nome}).join(' + ')||'Sem músico';
      var detalhe=(ev.musicos||[]).map(function(m){return m.nome+' (R$'+m.valor+')'}).join(' + ');
      var txt='';
      if(ev.musicos && ev.musicos.length>0){
        if(qtd>1) txt=nomes+'<br><small>'+detalhe+' x'+qtd+' shows = Total R$'+ev.valor+'</small>';
        else txt=nomes+'<br><small>'+detalhe+' • Total R$'+ev.valor+'</small>';
      }else txt='Total R$'+ev.valor;
      lista.innerHTML+='<div class="eventCard"><span class="badgeShows">'+qtd+' shows</span><div class="eventTitle">'+ev.projeto+' - '+ev.casa+'</div><div>'+slotsHtml+'</div><div class="eventSub">'+txt+'</div><div class="eventActions"><button class="btnEdit" onclick="edita('+ev.id+')">Editar</button><button class="btnDel" onclick="exclui('+ev.id+')">Excluir</button></div></div>';
    });
  });
  if(filtrados.length==0) lista.innerHTML='<p style="text-align:center;padding:32px;color:#9CA3AF;font-size:12px">Nenhum evento<br>Clique no + para criar<br><br>DIA '+dia+' / '+mesAtual.toLocaleDateString('pt-BR',{month:'long'}).toUpperCase()+' / '+ano+'</p>';
  var sel=document.getElementById('eCasa');sel.innerHTML='<option value="">Casa</option>'; casas.forEach(function(c){ var opt=document.createElement('option'); opt.value=c.nome; opt.textContent=c.nome; sel.appendChild(opt) });
  document.getElementById('contador').innerText=eventos.length+' dias • '+(eventos.reduce(function(s,e){return s+(e.slots?e.slots.length:1)},0))+' shows • '+musicos.length+' músicos • permanente';
}
function mudaMes(dir){ mesAtual.setMonth(mesAtual.getMonth()+dir); render(); }
function abreNovo(){ editId=null; selMusicos=[]; document.getElementById('modTitle').innerText='Novo cronograma - DATA MES ANO'; document.getElementById('eData').value=mesAtual.toISOString().slice(0,10); document.getElementById('chkAlmoco').checked=true; document.getElementById('chkJanta').checked=true; renderMusEvento(); document.getElementById('modEdit').classList.add('open'); }
function edita(id){ var ev=eventos.find(function(e){return e.id==id}); if(!ev) return; editId=id; selMusicos=ev.musicos?ev.musicos.map(function(m){return m.id}):[]; document.getElementById('eData').value=ev.data; document.getElementById('eProjeto').value=ev.projeto; if(ev.slots){ var alm=ev.slots.find(function(s){return s.tipo=='almoco'}); var jan=ev.slots.find(function(s){return s.tipo=='janta'}); document.getElementById('chkAlmoco').checked=!!alm; document.getElementById('chkJanta').checked=!!jan; if(alm){document.getElementById('eIniA').value=alm.inicio; document.getElementById('eFimA').value=alm.fim} if(jan){document.getElementById('eIniJ').value=jan.inicio; document.getElementById('eFimJ').value=jan.fim} } renderMusEvento(); document.getElementById('modEdit').classList.add('open'); }
function renderMusEvento(){ var div=document.getElementById('listaMusicosEvento'); if(musicos.length==0){div.innerHTML='<small style="color:#9CA3AF">Nenhum músico</small>'; calc(); return} var html=''; musicos.forEach(function(m){ var ch=selMusicos.includes(m.id)?'checked':''; var on=selMusicos.includes(m.id)?'on':''; html+='<label class="musCheck '+on+'"><div><input type="checkbox" '+ch+' onchange="toggleM('+m.id+')"><span>'+m.nome+'</span></div><span style="color:#6D5BFF;font-weight:700">R$ '+m.valor+'</span></label>' }); div.innerHTML=html; calc(); }
function toggleM(id){ if(selMusicos.includes(id)) selMusicos=selMusicos.filter(function(x){return x!=id}); else selMusicos.push(id); renderMusEvento(); }
function calc(){ var qtd=(document.getElementById('chkAlmoco').checked?1:0)+(document.getElementById('chkJanta').checked?1:0); if(qtd==0) qtd=1; var total=0; selMusicos.forEach(function(id){ var m=musicos.find(function(x){return x.id==id}); if(m) total+=parseFloat(m.valor)||0 }); var geral=total*qtd; document.getElementById('txtShows').innerText=qtd+' shows'; document.getElementById('totalCache').innerText='R$ '+geral; return {geral:geral} }
function salva(){ var data=document.getElementById('eData').value; var proj=document.getElementById('eProjeto').value; var casa=document.getElementById('eCasa').value||proj; if(!data){alert('Data obrigatória');return} var slots=[]; if(document.getElementById('chkAlmoco').checked) slots.push({tipo:'almoco',inicio:document.getElementById('eIniA').value||'12:30',fim:document.getElementById('eFimA').value||'15:30'}); if(document.getElementById('chkJanta').checked) slots.push({tipo:'janta',inicio:document.getElementById('eIniJ').value||'19:00',fim:document.getElementById('eFimJ').value||'22:00'}); if(slots.length==0){alert('Marque almoço ou janta');return} var c=calc(); var geral=c.geral; var listaMus=[]; selMusicos.forEach(function(id){ var m=musicos.find(function(x){return x.id==id}); if(m) listaMus.push(m) }); if(editId){ var ev=eventos.find(function(e){return e.id==editId}); ev.data=data; ev.projeto=proj; ev.casa=casa; ev.slots=slots; ev.valor=geral; ev.musicos=listaMus; }else{ eventos.push({id:Date.now(),data:data,projeto:proj,casa:casa,slots:slots,valor:geral,musicos:listaMus}) } save(); closeM('modEdit'); render(); }
function exclui(id){ if(!confirm('Excluir?')) return; eventos=eventos.filter(function(e){return e.id!=id}); save(); render(); }
function openMusicos(){ renderMus(); document.getElementById('modMusicos').classList.add('open'); }
function renderMus(){ var d=document.getElementById('listaMusicos'); var h=''; musicos.forEach(function(m,i){ h+='<div style="display:flex;justify-content:space-between;padding:8px;border:1px solid #E5E7EB;border-radius:8px;margin:4px 0"><span><b>'+m.nome+'</b> R$'+m.valor+'</span><button onclick="delMus('+i+')" style="border:none;background:none;color:#999">✕</button></div>' }); d.innerHTML=h||'<small style="color:#999">Nenhum</small>'; }
function addMusico(){ var n=document.getElementById('musNome').value.trim(); var v=parseFloat(document.getElementById('musValor').value)||0; if(!n||!v){alert('Nome e valor');return} musicos.push({id:Date.now(),nome:n,valor:v}); save(); document.getElementById('musNome').value=''; document.getElementById('musValor').value=''; renderMus(); render(); }
function delMus(i){ if(!confirm('Excluir?'))return; musicos.splice(i,1); save(); renderMus(); render(); }
function openCasas(){ renderCasas(); document.getElementById('modCasas').classList.add('open'); }
function renderCasas(){ var d=document.getElementById('listaCasas'); var h=''; casas.forEach(function(c,i){ h+='<div style="display:flex;justify-content:space-between;padding:8px;border:1px solid #E5E7EB;border-radius:8px;margin:4px 0"><span>'+c.nome+'</span><button onclick="delCasa('+i+')" style="border:none;background:none;color:#999">✕</button></div>' }); d.innerHTML=h||'<small style="color:#999">Nenhuma</small>'; }
function addCasa(){ var n=document.getElementById('casaNome').value.trim(); if(!n) return; casas.push({nome:n}); save(); document.getElementById('casaNome').value=''; renderCasas(); }
function delCasa(i){ casas.splice(i,1); save(); renderCasas(); }
function escolheZap(){ document.getElementById('modZap').classList.add('open'); }
function getTexto(comValor){
  var filtrados=eventos.filter(function(ev){ var d=new Date(ev.data+'T00:00:00'); return d.getMonth()==mesAtual.getMonth()&&d.getFullYear()==mesAtual.getFullYear() }).sort(function(a,b){return a.data.localeCompare(b.data)});
  var txt=''; var grupos={}; filtrados.forEach(function(ev){ if(!grupos[ev.data]) grupos[ev.data]=[]; grupos[ev.data].push(ev) });
  Object.keys(grupos).sort().forEach(function(data){ var d=new Date(data+'T00:00:00'); txt+=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()+'\n'; grupos[data].forEach(function(ev){ (ev.slots||[]).forEach(function(s){ var label=s.tipo=='almoco'?'ALMOÇO':'JANTA'; var musTxt=(ev.musicos||[]).map(function(m){return m.nome}).join(' + '); if(comValor){ var mv=(ev.musicos||[]).map(function(m){return m.nome+' R$'+m.valor}).join(' + '); txt+=label+': '+ev.projeto+' '+s.inicio+'-'+s.fim+' ['+ev.casa+'] '+mv+' = R$'+(ev.musicos?ev.musicos.reduce(function(a,b){return a+(parseFloat(b.valor)||0)},0):ev.valor)+'\n'; }else{ txt+=label+': '+ev.casa+' - '+musTxt+' - '+s.inicio+'-'+s.fim+'\n'; } }); if(comValor) txt+='Total dia R$'+ev.valor+'\n\n'; else txt+='\n'; }) }); return txt||'Sem eventos';
}
function exportZap(comValor){ var t=getTexto(comValor); var titulo=comValor?'*AGENDA COM VALOR*':'*CRONOGRAMA SEM VALOR - só casa nome horário*'; var msg=titulo+'\n\n'+t; window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank'); }
function exportNormal(){ var w=window.open('','','width=800,height=600'); w.document.write('<pre style="font-family:Arial;padding:20px">'+getTexto(true)+'</pre>'); w.document.close(); w.print(); }
function exportFolha(){ exportNormal(); }
function exportPdf(){ exportNormal(); }

render();
</script>

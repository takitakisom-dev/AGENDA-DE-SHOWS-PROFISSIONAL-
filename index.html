<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI v65.7 DEFINITIVA - FUNCIONA</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#F1F5F9;font-family:Arial,sans-serif;padding-bottom:92px}
.top{position:sticky;top:0;z-index:100;background:#1E3A8A;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;height:60px}
.cardMes{background:#fff;margin:10px;border:1px solid #E2E8F0;border-radius:18px;padding:16px;text-align:center}
.arrow{width:44px;height:44px;background:#F8FAFC;border:1px solid #E2E8F0;border-radius:12px;font-size:22px;cursor:pointer;font-weight:800;color:#1E3A8A}
.filters{display:flex;gap:6px;justify-content:center;margin:12px;flex-wrap:wrap}.filters button{border:1px solid #E2E8F0;background:#fff;color:#64748B;padding:8px 14px;border-radius:20px;font-weight:600;font-size:12px;cursor:pointer}
.filters button.active{background:#2563EB;color:#fff}
.contador{margin:0 10px;background:#10B981;color:#fff;border-radius:12px;padding:10px;text-align:center;font-size:12px;font-weight:700}
.dayHeader{background:#1E3A8A;color:#fff;padding:10px 14px;border-radius:10px;margin:16px 10px 10px;font-weight:700;font-size:12px}
.eventCard{background:#fff;margin:0 10px 14px;border:1px solid #E2E8F0;border-radius:16px;padding:14px}
.eventTitle{font-weight:800;font-size:16px;color:#1E3A8A}
.slot{font-size:13px;background:#F8FAFC;padding:8px 12px;border-radius:8px;margin:4px 0}
.eventSub{font-size:12px;font-weight:600;background:#EFF6FF;padding:10px;border-radius:8px;margin-top:6px}
.plus{position:fixed;bottom:86px;right:14px;width:56px;height:56px;background:#2563EB;color:#fff;border:none;border-radius:16px;font-size:28px;z-index:90;cursor:pointer}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;gap:8px;padding:12px;border-top:1px solid #E2E8F0;z-index:200}
.bottom button{flex:1;border:1px solid #E2E8F0;padding:12px;border-radius:12px;font-weight:700;font-size:11px;cursor:pointer;background:#fff}
.bottom button.btnZap{background:#1E3A8A;color:#fff}
</style>
</head>
<body>
<div class="top"><div><b>TAKI v65.7 DEFINITIVA</b></div><button onclick="localStorage.clear();location.reload()" style="background:#fff;color:#C00;border:none;padding:7px 14px;border-radius:20px;font-weight:800;font-size:11px">LIMPAR E DESTRAVAR</button></div>
<div class="cardMes"><b><button class="arrow" onclick="mudaMes(-1)"><</button> <span id="labelMes">OUTUBRO DE 2026</span> <button class="arrow" onclick="mudaMes(1)">></button></b></div>
<div class="filters"><button onclick="setView('semana')" id="fSemana" class="active">Semana</button><button onclick="setView('mes')" id="fMes">Mês</button><button onclick="setView('ano')" id="fAno">Ano</button></div>
<div class="contador" id="contador">15 eventos carregados - v65.7 FUNCIONA!</div>
<div id="lista"></div>
<button class="plus" onclick="alert('Adicionar em breve')">+</button>
<div class="bottom"><button class="btnZap" onclick="exportZap(true)">ZAP COM VALOR</button><button class="btnZap" style="background:#059669" onclick="exportZap(false)">ZAP SEM VALOR</button></div>
<script>
var eventos = [
{casa:"P1",data:"2026-10-19",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"ANDERSON VAT 60 DUO",valor:400}],valor:400},
{casa:"P2",data:"2026-10-19",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"RICK DUO",valor:400}],valor:400},
{casa:"P3",data:"2026-10-19",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"RICK SOLO",valor:300}],valor:300},
{casa:"P4",data:"2026-10-19",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"ANDRÉ",valor:300}],valor:300},
{casa:"P5",data:"2026-10-19",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"DOUGLAS",valor:300}],valor:300},
{casa:"P1",data:"2026-10-20",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"ISRAEL",valor:300}],valor:300},
{casa:"P2",data:"2026-10-20",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"LUCIANO",valor:300}],valor:300},
{casa:"P3",data:"2026-10-20",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"MARTIN",valor:300}],valor:300},
{casa:"P4",data:"2026-10-20",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"RICK DUO",valor:400}],valor:400},
{casa:"P5",data:"2026-10-20",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"YGOR",valor:300}],valor:300},
{casa:"P1",data:"2026-10-21",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"ANDERSON VAT 60 DUO",valor:400}],valor:400},
{casa:"P2",data:"2026-10-21",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"EDILL",valor:300}],valor:300},
{casa:"P3",data:"2026-10-21",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"},{tipo:"almoco",inicio:"12:30",fim:"15:30"}],musicos:[{nome:"ANDERSON VAT 60 TRIO",valor:450}],valor:900},
{casa:"P4",data:"2026-10-21",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"RICK TRIO",valor:450}],valor:450},
{casa:"P5",data:"2026-10-21",slots:[{tipo:"janta",inicio:"19:00",fim:"22:00"}],musicos:[{nome:"GERVÁSIO",valor:200}],valor:200}
];
var mesAtual = new Date(2026,9,19);
var view = 'semana';
function mudaMes(dir){mesAtual.setMonth(mesAtual.getMonth()+dir);render();}
function setView(v){view=v;document.querySelectorAll('.filters button').forEach(function(b){b.classList.remove('active')});document.getElementById('f'+v.charAt(0).toUpperCase()+v.slice(1)).classList.add('active');render();}
function render(){
var mes=mesAtual.getMonth(),ano=mesAtual.getFullYear();
document.getElementById('labelMes').innerHTML=mesAtual.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase();
var lista=document.getElementById('lista');lista.innerHTML='';
var filtrados=eventos;
if(view=='mes'){filtrados=eventos.filter(function(ev){var d=new Date(ev.data+'T00:00:00');return d.getMonth()==mes&&d.getFullYear()==ano;});}
else if(view=='semana'){filtrados=eventos.filter(function(ev){var d=new Date(ev.data+'T00:00:00');var ini=new Date(mesAtual);ini.setDate(mesAtual.getDate()-mesAtual.getDay());var fim=new Date(ini);fim.setDate(ini.getDate()+6);return d>=ini&&d<=fim;});}
filtrados.sort(function(a,b){return a.data.localeCompare(b.data);});
var grupos={};filtrados.forEach(function(ev){if(!grupos[ev.data])grupos[ev.data]=[];grupos[ev.data].push(ev);});
Object.keys(grupos).sort().forEach(function(data){
var d=new Date(data+'T00:00:00');var titulo=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
lista.innerHTML+='<div class="dayHeader">'+titulo+'</div>';
grupos[data].forEach(function(ev){
var slotsHtml='';ev.slots.forEach(function(s){var label=s.tipo=='almoco'?'ALMOÇO':'JANTA';slotsHtml+='<div class="slot">'+label+': '+s.inicio+' - '+s.fim+'</div>';});
var nomes=ev.musicos.map(function(m){return m.nome}).join(' + ');
lista.innerHTML+='<div class="eventCard"><div class="eventTitle">'+ev.casa+'</div>'+slotsHtml+'<div class="eventSub">'+nomes+' - R$'+ev.valor+'</div></div>';
});
});
if(filtrados.length==0){lista.innerHTML='<div style="text-align:center;padding:20px">Nenhum evento nessa semana<br><button onclick="setView(\'ano\')" style="margin-top:10px;padding:10px 20px;background:#2563EB;color:#fff;border:none;border-radius:10px">VER ANO TODO - '+eventos.length+' eventos</button></div>';}
document.getElementById('contador').innerHTML=filtrados.length+' eventos em '+view+' | Total '+eventos.length+' eventos - v65.7 FUNCIONA!';
}
function isDataLine(l){var u=l.toUpperCase();return (u.includes("-FEIRA")||u.includes("SÁBADO")||u.includes("SABADO")||u.includes("DOMINGO"))&&u.includes(" DE ");}
function getTexto(comValor){
var txt='';var grupos={};eventos.forEach(function(ev){if(!grupos[ev.data])grupos[ev.data]=[];grupos[ev.data].push(ev);});
Object.keys(grupos).sort().forEach(function(data){
var d=new Date(data+'T00:00:00');txt+=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()+'\n';
grupos[data].forEach(function(ev){
ev.slots.forEach(function(s){
var label=s.tipo=='almoco'?'ALMOÇO':'JANTA';
var musTxt=ev.musicos.map(function(m){return m.nome}).join(' + ');
if(comValor){var mv=ev.musicos.map(function(m){return m.nome+' R$'+m.valor}).join(' + ');txt+=label+': '+ev.casa+' - '+mv+' - '+s.inicio+'-'+s.fim+' = R$'+ev.valor+'\n';}
else{txt+=label+': '+ev.casa+' - '+musTxt+' - '+s.inicio+'-'+s.fim+'\n';}
});
txt+='\n';
});
});return txt;
}
function exportZap(comValor){
var t=getTexto(comValor);var linhas=t.split('\n');var tBold='';linhas.forEach(function(l){if(isDataLine(l)){tBold+='*'+l+'*\n';}else{tBold+=l+'\n';}});
var titulo=comValor?'*AGENDA TAKI SOM - COM VALOR*':'*CRONOGRAMA - SEM VALOR*';var msg=titulo+'\n\n'+tBold;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
render();
</script>
</body>
</html>

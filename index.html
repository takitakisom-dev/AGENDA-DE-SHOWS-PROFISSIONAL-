<div class="modal" id="modCasas"><div class="modalBox">
<b>🏠 Cadastrar casas com horário fixo</b>
<p style="font-size:11px;color:#6B7280;margin:6px 0 10px">Cadastre uma vez o horário de cada casa. Depois quando criar P1, P2, já vem automático.</p>
<input id="casaNome" class="inp" placeholder="Nome: P1, P2, P4, EDILL">
<div style="display:flex;gap:8px;margin-top:8px">
<div style="flex:1"><label style="font-size:10px;font-weight:800;color:#6B7280">ALMOÇO INÍCIO</label><input id="casaIniA" type="time" class="inp" value="12:30"></div>
<div style="flex:1"><label style="font-size:10px;font-weight:800;color:#6B7280">ALMOÇO FIM</label><input id="casaFimA" type="time" class="inp" value="15:30"></div>
</div>
<div style="display:flex;gap:8px;margin-top:4px">
<div style="flex:1"><label style="font-size:10px;font-weight:800;color:#6B7280">JANTA INÍCIO</label><input id="casaIniJ" type="time" class="inp" value="19:00"></div>
<div style="flex:1"><label style="font-size:10px;font-weight:800;color:#6B7280">JANTA FIM</label><input id="casaFimJ" type="time" class="inp" value="22:00"></div>
</div>
<div style="display:flex;gap:8px;margin-top:8px">
<label style="font-size:11px"><input type="checkbox" id="casaTemAlmoco"> Tem almoço</label>
<label style="font-size:11px"><input type="checkbox" id="casaTemJanta" checked> Tem janta</label>
</div>
<button class="btnPrimary" onclick="addCasa()">+ Salvar casa com horário</button>
<div id="listaCasas" style="margin-top:12px"></div>
<button class="btnGhost" onclick="closeM('modCasas')">Fechar</button>
</div></div>

<script>
// SUBSTITUI as funções de casa por essas:

function renderCasas(){
  var d=document.getElementById('listaCasas');var h='';
  casas.forEach(function(c,i){
    var horarios='';
    if(c.temAlmoco) horarios+='☀️ '+c.iniA+'-'+c.fimA+' ';
    if(c.temJanta) horarios+='🌙 '+c.iniJ+'-'+c.fimJ;
    h+='<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #E5E7EB;border-radius:10px;margin:5px 0"><div><b>'+c.nome+'</b><br><small style="color:#6B7280;font-size:10px">'+horarios+'</small></div><div><button onclick="editCasa('+i+')" style="border:none;background:#EEF2FF;color:#4338CA;padding:6px 10px;border-radius:6px;font-weight:700;font-size:11px;margin-right:4px">Editar</button><button onclick="delCasa('+i+')" style="border:none;background:none;color:#999">✕</button></div></div>';
  });
  d.innerHTML=h||'<small style="color:#999">Nenhuma casa. Cadastre P1, P2 com horário.</small>';
}

function addCasa(){
  var nome=document.getElementById('casaNome').value.trim().toUpperCase();
  if(!nome){alert('Nome da casa');return}
  var iniA=document.getElementById('casaIniA').value||'12:30';
  var fimA=document.getElementById('casaFimA').value||'15:30';
  var iniJ=document.getElementById('casaIniJ').value||'19:00';
  var fimJ=document.getElementById('casaFimJ').value||'22:00';
  var temA=document.getElementById('casaTemAlmoco').checked;
  var temJ=document.getElementById('casaTemJanta').checked;
  
  // Se já existe, atualiza
  var idx=casas.findIndex(function(c){return c.nome==nome});
  if(idx>=0){
    casas[idx]={nome:nome,iniA:iniA,fimA:fimA,iniJ:iniJ,fimJ:fimJ,temAlmoco:temA,temJanta:temJ};
  }else{
    casas.push({nome:nome,iniA:iniA,fimA:fimA,iniJ:iniJ,fimJ:fimJ,temAlmoco:temA,temJanta:temJ});
  }
  save();
  document.getElementById('casaNome').value='';
  renderCasas();
  render();
}

function editCasa(i){
  var c=casas[i];
  document.getElementById('casaNome').value=c.nome;
  document.getElementById('casaIniA').value=c.iniA||'12:30';
  document.getElementById('casaFimA').value=c.fimA||'15:30';
  document.getElementById('casaIniJ').value=c.iniJ||'19:00';
  document.getElementById('casaFimJ').value=c.fimJ||'22:00';
  document.getElementById('casaTemAlmoco').checked=!!c.temAlmoco;
  document.getElementById('casaTemJanta').checked=!!c.temJanta;
}

function delCasa(i){
  if(!confirm('Excluir casa '+casas[i].nome+'?'))return;
  casas.splice(i,1);save();renderCasas();render();
}

// Quando seleciona projeto, já puxa horário da casa
function setProjeto(p){
  projetoAtual=p;
  document.querySelectorAll('.projBtn').forEach(function(b){b.classList.remove('active')});
  var map={'P1':'btnP1','P2':'btnP2','P3':'btnP3','P4':'btnP4','EDILL':'btnEDILL','TAKI SOM':'btnTAKI'};
  if(map[p]) document.getElementById(map[p]).classList.add('active');
  
  // PUXA HORÁRIO AUTOMÁTICO DA CASA
  var casa=casas.find(function(c){return c.nome==p});
  if(casa){
    document.getElementById('chkAlmoco').checked=!!casa.temAlmoco;
    document.getElementById('chkJanta').checked=!!casa.temJanta;
    document.getElementById('eIniA').value=casa.iniA||'12:30';
    document.getElementById('eFimA').value=casa.fimA||'15:30';
    document.getElementById('eIniJ').value=casa.iniJ||'19:00';
    document.getElementById('eFimJ').value=casa.fimJ||'22:00';
    calc();
  }
}
</script>

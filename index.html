<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI SOM v72 FINAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#F1F5F9;font-family:Arial,sans-serif;padding-bottom:96px}
.top{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;padding:14px;text-align:center;font-weight:800;font-size:18px}
.cardMes{background:#fff;margin:10px;border:1px solid #E2E8F0;border-radius:18px;padding:16px;text-align:center}
.cardMes b{font-size:16px;display:flex;justify-content:center;align-items:center;gap:12px}
.arrow{width:42px;height:42px;border:1px solid #E2E8F0;background:#F8FAFC;border-radius:10px;font-size:22px;font-weight:800;color:#1E3A8A;cursor:pointer}
.chips{display:flex;gap:8px;justify-content:center;margin-top:12px}
.chip{border:1px solid #E2E8F0;background:#F8FAFC;border-radius:10px;padding:8px 12px;min-width:76px;text-align:center}
.chip b{font-size:9px;color:#64748B;display:block}
.chip span{font-size:13px;font-weight:800;color:#1E3A8A;display:block;margin-top:2px}
.filtros{display:flex;gap:6px;justify-content:center;margin:12px;flex-wrap:wrap}
.filtros button{border:1px solid #E2E8F0;background:#fff;padding:8px 14px;border-radius:20px;font-weight:700;font-size:12px;cursor:pointer}
.filtros button.ativo{background:#2563EB;color:#fff;border-color:#2563EB}
.cont{margin:0 10px;background:#10B981;color:#fff;border-radius:10px;padding:10px;text-align:center;font-weight:800;font-size:12px}
.dia{background:linear-gradient(135deg,#1E3A8A,#2563EB);color:#fff;padding:9px 12px;border-radius:8px;margin:14px 10px 8px;font-weight:800;font-size:12px}
.ev{background:#fff;margin:0 10px 10px;border:1px solid #E2E8F0;border-radius:12px;padding:12px;position:relative}
.ev b{color:#1E3A8A}
.badge{position:absolute;top:10px;right:10px;background:#2563EB;color:#fff;padding:3px 8px;border-radius:20px;font-size:10px;font-weight:700}
.turno{font-size:11px;background:#F8FAFC;border:1px solid #F1F5F9;padding:6px 8px;border-radius:6px;margin:4px 0;display:flex;justify-content:space-between}
.acoes{display:flex;gap:6px;margin-top:8px}
.acoes button{flex:1;padding:7px;border:1px solid #E2E8F0;border-radius:6px;font-size:11px;font-weight:700;background:#fff;cursor:pointer}
.plus{position:fixed;bottom:84px;right:12px;width:56px;height:56px;background:#2563EB;color:#fff;border:none;border-radius:16px;font-size:28px;cursor:pointer;z-index:50}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;gap:8px;padding:10px;border-top:1px solid #E2E8F0;z-index:100}
.bottom button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;font-size:11px;color:#fff;cursor:pointer}
.b1{background:#1E3A8A}.b2{background:#059669}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:12px}
.modal.aberto{display:flex}
.box{background:#fff;border-radius:14px;padding:14px;width:100%;max-width:420px;max-height:88vh;overflow:auto}
.inp{width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:8px;margin:4px 0;font-size:13px}
.btn{width:100%;padding:11px;border:none;border-radius:8px;font-weight:800;background:#2563EB;color:#fff;margin-top:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:6px 0}
.grid button{padding:9px;border:1px solid #E2E8F0;border-radius:8px;background:#fff;font-weight:700;font-size:11px;cursor:pointer}
.grid button.on{background:#2563EB;color:#fff;border-color:#2563EB}
.mus{max-height:160px;overflow:auto;border:1px solid #E2E8F0;border-radius:8px;padding:4px;margin:6px 0}
.mus label{display:flex;justify-content:space-between;padding:7px;border-radius:6px;margin:2px 0;cursor:pointer;font-size:12px}
.mus label.on{background:#EFF6FF;border:1px solid #2563EB}
</style>
</head>
<body>
<script>try{localStorage.clear();}catch(e){}</script>
<div class="top">TAKI SOM</div>
<div class="cardMes"><b><button class="arrow" onclick="mudaMes(-1)">‹</button><span id="mesLabel">MES DE OUTUBRO DE 2026</span><button class="arrow" onclick="mudaMes(1)">›</button></b><div class="chips"><div class="chip"><b>DIA</b><span id="cDia">19</span></div><div class="chip"><b>MÊS</b><span id="cMes">OUTUBRO</span></div><div class="chip"><b>ANO</b><span id="cAno">2026</span></div></div></div>
<div class="filtros"><button onclick="setV('hoje')" id="vHoje">Hoje</button><button onclick="setV('dia')" id="vDia">Dia</button><button class="ativo" onclick="setV('semana')" id="vSemana">Semana</button><button onclick="setV('mes')" id="vMes">Mês</button><button onclick="setV('ano')" id="vAno">Ano Todo</button></div>
<div class="cont" id="cont">15 eventos - P1 a P6 - EDILL MÚSICO</div>
<div id="lista"></div>
<button class="plus" onclick="novo()">+</button>
<div class="bottom"><button class="b1" onclick="zap(true)">ZAP COM VALOR - NEGRITO TOTAL</button><button class="b2" onclick="zap(false)">ZAP SEM VALOR - NEGRITO TOTAL</button></div>
<div class="modal" id="modal"><div class="box">
<b id="mt">Novo Show</b><br><br>
Data: <input id="data" type="date" class="inp" value="2026-10-19">
<div style="font-weight:800;font-size:11px;margin-top:8px">RESTAURANTE P1 a P6:</div>
<div class="grid"><button id="pP1" class="on" onclick="selP('P1')">P1</button><button id="pP2" onclick="selP('P2')">P2</button><button id="pP3" onclick="selP('P3')">P3</button><button id="pP4" onclick="selP('P4')">P4</button><button id="pP5" onclick="selP('P5')">P5</button><button id="pP6" onclick="selP('P6')">P6</button></div>
<div style="font-weight:800;font-size:11px">TURNO:</div>
<label><input type="checkbox" id="alm"> Almoço 12:30-15:30</label><br><label><input type="checkbox" id="jan" checked> Janta 19:00-22:00</label>
<div style="font-weight:800;font-size:11px;margin-top:6px">MÚSICO - EDILL AQUI:</div>
<div class="mus" id="musLista"></div>
<button class="btn" onclick="salvar()">Salvar</button><button class="btn" style="background:#fff;color:#64748B;border:1px solid #E2E8F0" onclick="fechar()">Cancelar</button>
</div></div>
<script>
var eventos=[
{id:1,data:"2026-10-19",casa:"P1",mus:"ANDERSON VAT 60 DUO",valor:400,turno:"Janta 19:00-22:00"},
{id:2,data:"2026-10-19",casa:"P2",mus:"RICK DUO",valor:400,turno:"Janta 19:00-22:00"},
{id:3,data:"2026-10-19",casa:"P3",mus:"RICK SOLO",valor:300,turno:"Janta 19:00-22:00"},
{id:4,data:"2026-10-19",casa:"P4",mus:"ROBSON SOLO",valor:300,turno:"Janta 19:00-22:00"},
{id:5,data:"2026-10-19",casa:"P5",mus:"ISRAEL",valor:300,turno:"Janta 19:00-22:00"},
{id:6,data:"2026-10-19",casa:"P6",mus:"DOUGLAS",valor:300,turno:"Janta 19:00-22:00"},
{id:7,data:"2026-10-20",casa:"P1",mus:"LUCIANO",valor:300,turno:"Janta 19:00-22:00"},
{id:8,data:"2026-10-20",casa:"P2",mus:"ANDRÉ",valor:300,turno:"Janta 19:00-22:00"},
{id:9,data:"2026-10-20",casa:"P3",mus:"MARTIN",valor:300,turno:"Janta 19:00-22:00"},
{id:10,data:"2026-10-20",casa:"P4",mus:"GERVÁSIO",valor:200,turno:"Janta 19:00-22:00"},
{id:11,data:"2026-10-21",casa:"P1",mus:"ANDERSON VAT 60 DUO",valor:400,turno:"Janta 19:00-22:00"},
{id:12,data:"2026-10-21",casa:"P2",mus:"ANDERSON VAT 60 TRIO",valor:450,turno:"Janta 19:00-22:00"},
{id:13,data:"2026-10-21",casa:"P3",mus:"EDILL",valor:300,turno:"Janta 19:00-22:00"},
{id:14,data:"2026-10-21",casa:"P4",mus:"YGOR",valor:300,turno:"Janta 19:00-22:00"},
{id:15,data:"2026-10-21",casa:"P5",mus:"DOUGLAS",valor:300,turno:"Janta 19:00-22:00"}
];
var musicos=[
{nome:"ANDERSON VAT 60 DUO",valor:400},{nome:"ANDERSON VAT 60 TRIO",valor:450},{nome:"ANDRÉ",valor:300},{nome:"DOUGLAS",valor:300},{nome:"EDILL",valor:300},{nome:"GERVÁSIO",valor:200},{nome:"ISRAEL",valor:300},{nome:"LUCIANO",valor:300},{nome:"MARTIN",valor:300},{nome:"RICK DUO",valor:400},{nome:"RICK SOLO",valor:300},{nome:"RICK TRIO",valor:450},{nome:"ROBSON SOLO",valor:300},{nome:"YGOR",valor:300}
];
var view="semana";var casaSel="P1";var musSel="";var editId=null;var mesAtual=new Date(2026,9,19);
function selP(p){casaSel=p;document.querySelectorAll('.grid button').forEach(function(b){b.classList.remove('on')});var el=document.getElementById('p'+p);if(el)el.classList.add('on');}
function setV(v){view=v;document.querySelectorAll('.filtros button').forEach(function(b){b.classList.remove('ativo')});var id="v"+v.charAt(0).toUpperCase()+v.slice(1);var el=document.getElementById(id);if(el)el.classList.add('ativo');render();}
function mudaMes(d){mesAtual.setMonth(mesAtual.getMonth()+d);var mn=mesAtual.toLocaleDateString('pt-BR',{month:'long'}).toUpperCase();document.getElementById('mesLabel').innerText="MES DE "+mn+" DE "+mesAtual.getFullYear();document.getElementById('cDia').innerText=mesAtual.getDate();document.getElementById('cMes').innerText=mn;document.getElementById('cAno').innerText=mesAtual.getFullYear();render();}
function render(){
 var filt=eventos;if(view=="semana")filt=eventos.filter(function(e){return e.data>="2026-10-19"&&e.data<="2026-10-25";});else if(view=="mes")filt=eventos.filter(function(e){return e.data.indexOf("2026-10")==0;});else if(view=="dia")filt=eventos.filter(function(e){return e.data=="2026-10-19";});
 filt.sort(function(a,b){return a.data.localeCompare(b.data);});
 var grupos={};filt.forEach(function(e){if(!grupos[e.data])grupos[e.data]=[];grupos[e.data].push(e);});
 var html="";Object.keys(grupos).sort().forEach(function(d){
  var tit=d;try{var dt=new Date(d+"T00:00:00");tit=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();}catch(e){}
  html+='<div class="dia">'+tit+'</div>';
  grupos[d].forEach(function(ev){html+='<div class="ev"><span class="badge">1 show</span><b>'+ev.casa+' - '+ev.mus+'</b><div class="turno"><span>'+ev.turno+'</span><span>R$ '+ev.valor+'</span></div><div class="acoes"><button onclick="editar('+ev.id+')">Editar</button><button onclick="excluir('+ev.id+')">Excluir</button></div></div>';});
 });
 if(filt.length==0)html='<div class="cardMes" style="padding:20px;text-align:center"><b>Nenhum evento em '+view+'</b><br><br><button onclick="setV(\'ano\')" style="padding:10px 16px;background:#2563EB;color:#fff;border:none;border-radius:8px;font-weight:800">Ver Ano Todo - '+eventos.length+' eventos</button></div>';
 document.getElementById('lista').innerHTML=html;
 document.getElementById('cont').innerText=filt.length+' eventos em '+view.toUpperCase()+' | Total '+eventos.length+' eventos - P1-P6 - EDILL MUSICO - v72 FINAL FUNCIONA!';
}
function novo(){editId=null;musSel="";casaSel="P1";selP("P1");document.getElementById('data').value="2026-10-19";document.getElementById('alm').checked=false;document.getElementById('jan').checked=true;document.getElementById('mt').innerText="Novo Show";renderMus();document.getElementById('modal').classList.add('aberto');}
function editar(id){var ev=eventos.find(function(e){return e.id==id;});if(!ev)return;editId=id;casaSel=ev.casa;musSel=ev.mus;selP(ev.casa);document.getElementById('data').value=ev.data;document.getElementById('mt').innerText="Editar Show";renderMus();document.getElementById('modal').classList.add('aberto');}
function renderMus(){var div=document.getElementById('musLista');var h="";musicos.forEach(function(m){var sel=m.nome==musSel;var cl=sel?"on":"";var ch=sel?"checked":"";h+='<label class="'+cl+'"><span><input type="radio" name="mus" '+ch+' onchange="musSel=\''+m.nome.replace(/'/g,"\\'")+'\';renderMus()"> '+m.nome+'</span><span style="color:#2563EB;font-weight:800">R$ '+m.valor+'</span></label>';});div.innerHTML=h;}
function fechar(){document.getElementById('modal').classList.remove('aberto');}
function salvar(){
 var data=document.getElementById('data').value;if(!data){alert('Data');return;}if(!musSel){alert('Escolhe músico - EDILL tá na lista!');return;}
 var alm=document.getElementById('alm').checked;var jan=document.getElementById('jan').checked;var turno="";if(alm&&jan)turno="Almoço 12:30-15:30 + Janta 19:00-22:00";else if(alm)turno="Almoço 12:30-15:30";else turno="Janta 19:00-22:00";
 var m=musicos.find(function(x){return x.nome==musSel;});var valor=m?m.valor:300;
 if(editId){var ev=eventos.find(function(e){return e.id==editId;});ev.data=data;ev.casa=casaSel;ev.mus=musSel;ev.valor=valor;ev.turno=turno;}
 else{eventos.push({id:Date.now(),data:data,casa:casaSel,mus:musSel,valor:valor,turno:turno});}
 fechar();render();
}
function excluir(id){if(!confirm('Excluir?'))return;eventos=eventos.filter(function(e){return e.id!=id;});render();}
function isDataLine(l){var u=l.toUpperCase();return (u.indexOf("-FEIRA")>=0||u.indexOf("SÁBADO")>=0||u.indexOf("SABADO")>=0||u.indexOf("DOMINGO")>=0)&&u.indexOf(" DE ")>=0;}
function zap(comValor){
 var grupos={};eventos.forEach(function(e){if(!grupos[e.data])grupos[e.data]=[];grupos[e.data].push(e);});
 var txt="";Object.keys(grupos).sort().forEach(function(d){
  try{var dt=new Date(d+"T00:00:00");txt+=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()+"\n";}catch(e){txt+=d+"\n";}
  grupos[d].forEach(function(ev){
   if(comValor)txt+="RESTAURANTE "+ev.casa+" - MÚSICO "+ev.mus+" R$"+ev.valor+" - "+ev.turno+" = R$"+ev.valor+"\n";
   else txt+="RESTAURANTE "+ev.casa+" - MÚSICO "+ev.mus+" - "+ev.turno+"\n";
  });txt+="\n";
 });
 var linhas=txt.split("\n");var bold="";linhas.forEach(function(l){if(isDataLine(l))bold+="*"+l+"*\n";else bold+=l+"\n";});
 var titulo=comValor?"*AGENDA TAKI SOM - COM VALOR*":"*CRONOGRAMA - SEM VALOR*";
 var msg=titulo+"\n\n"+bold;
 window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}
render();
</script>
</body>
</html>

<script>
// ... mantém todo seu código igual, só troca essas 2 funções:

function getNomeCurto(ev){
  var nome=ev.casa||ev.projeto||'P1';
  if(nome.includes(' - ')){
    var partes=nome.split(' - ');
    var ultima=partes[partes.length-1].trim();
    if(['P1','P2','P3','P4','P5','EDILL'].includes(ultima.toUpperCase()) || ultima.length<=4) return ultima;
  }
  return nome;
}

function exportFolha(comValor){
  var filtrados=eventos.filter(function(ev){var d=new Date(ev.data+'T00:00:00');return d.getMonth()==mesAtual.getMonth()&&d.getFullYear()==mesAtual.getFullYear()}).sort(function(a,b){return a.data.localeCompare(b.data)});
  var titulo=comValor?'FOLHA - COM VALOR - CASA, NOME, DATA, HORÁRIO, PERÍODO':'FOLHA - CRONOGRAMA SEM VALOR - CASA, NOME, DATA, HORÁRIO, PERÍODO';
  var html='<html><head><meta charset="UTF-8"><title>'+titulo+'</title><style>';
  html+='@page{size:landscape;margin:10mm} body{font-family:Inter,Arial,sans-serif;padding:12px;color:#111827}';
  html+='h2{text-align:center;font-size:18px;font-weight:800;margin-bottom:4px} .sub{text-align:center;font-size:11px;color:#6B7280;margin-bottom:14px}';
  html+='table{width:100%;border-collapse:collapse;font-size:12px} th,td{border:1px solid #111827;padding:8px 10px;text-align:left}';
  html+='th{background:#111827;color:#fff;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase}';
  html+='td{font-size:12px} tr:nth-child(even){background:#F9FAFB}';
  html+='.casa{font-weight:800;font-size:13px} .musico{font-weight:700} .periodo{font-weight:700;padding:4px 8px;border-radius:6px;display:inline-block;font-size:10px}';
  html+='.periodo.janta{background:#111827;color:#fff} .periodo.almoco{background:#FBBF24;color:#111827}';
  html+='.total{background:#FEF3C7;font-weight:800} @media print{button{display:none}}';
  html+='</style></head><body>';
  html+='<h2>CRONOGRAMA - '+mesAtual.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase()+(comValor?' - COM VALOR':' - SEM VALOR')+'</h2>';
  html+='<div class="sub">CASA • NOME • DATA • HORÁRIO • PERÍODO | Impresso em '+new Date().toLocaleString('pt-BR')+'</div>';
  html+='<table><tr><th>CASA</th><th>MÚSICOS / NOME</th><th>DATA</th><th>HORÁRIO</th><th>PERÍODO</th>';
  if(comValor) html+='<th>VALOR</th>';
  html+='</tr>';
  
  filtrados.forEach(function(ev){
    var d=new Date(ev.data+'T00:00:00');
    var nomeCurto=getNomeCurto(ev);
    (ev.slots||[]).forEach(function(s){
      var label=s.tipo=='almoco'?'ALMOÇO':'JANTA';
      var classe=s.tipo=='almoco'?'almoco':'janta';
      var musTxt=(ev.musicos||[]).map(function(m){return m.nome}).join(' + ')||'-';
      html+='<tr>';
      html+='<td class="casa">'+nomeCurto+'</td>';
      html+='<td class="musico">'+musTxt+'</td>';
      html+='<td>'+ev.data.split('-').reverse().join('/')+'</td>';
      html+='<td><b>'+s.inicio+' - '+s.fim+'</b></td>';
      html+='<td><span class="periodo '+classe+'">'+label+'</span></td>';
      if(comValor){
        var v=(ev.musicos||[]).reduce(function(a,b){return a+(parseFloat(b.valor)||0)},0);
        html+='<td>R$ '+v.toFixed(2).replace('.',',')+'</td>';
      }
      html+='</tr>';
    });
  });
  
  html+='<tr class="total"><td colspan="2"><b>TOTAL: '+filtrados.reduce(function(s,e){return s+(e.slots?e.slots.length:1)},0)+' shows</b></td><td colspan="'+(comValor?4:3)+'"><b>'+filtrados.length+' dias • '+mesAtual.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase()+'</b></td></tr>';
  html+='</table>';
  html+='<br><div style="display:flex;gap:12px;justify-content:center"><button onclick="window.print()" style="padding:14px 24px;background:#111827;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:13px;cursor:pointer">🖨️ IMPRIMIR - '+(comValor?'COM VALOR':'SEM VALOR - CASA, NOME, DATA, HORÁRIO, PERÍODO')+'</button></div>';
  html+='</body></html>';
  
  var w=window.open('','','width=1100,height=700');
  w.document.write(html);
  w.document.close();
}
</script>

var mesAtual=new Date(2026,9,19);

function limparTudo(){if(confirm('Limpar banco corrompido e destravar?')){localStorage.clear();alert('Limpo! Recarregando');location.reload();}}
function openMenu(){document.getElementById('takiMenu').classList.add('open')}
function closeMenu(){document.getElementById('takiMenu').classList.remove('open')}
function closeM(id){document.getElementById(id).classList.remove('open')}
function setView(v){view=v;document.querySelectorAll('.filters button').forEach(function(b){b.classList.remove('active')});var el=document.getElementById('f'+v.charAt(0).toUpperCase()+v.slice(1));if(v=='hoje')el=document.getElementById('fHoje');if(v=='mes')el=document.getElementById('fMes');if(v=='ano')el=document.getElementById('fAno');if(v=='dia')el=document.getElementById('fDia');if(v=='semana')el=document.getElementById('fSemana');if(el)el.classList.add('active');render();}
function getNomeCurto(ev){return ev.casa||ev.projeto||'P1';}
function render(){
try{
var mes=mesAtual.getMonth(),ano=mesAtual.getFullYear();
document.getElementById('labelMes').innerHTML=mesAtual.toLocaleDateString('pt-BR',{month:'long',year:'numeric'}).toUpperCase();
var lista=document.getElementById('lista');lista.innerHTML='';
var filtrados=eventos;
if(view=='mes'){filtrados=eventos.filter(function(ev){var d=new Date(ev.data+'T00:00:00');return d.getMonth()==mes&&d.getFullYear()==ano;});}
else if(view=='semana'){filtrados=eventos.filter(function(ev){var d=new Date(ev.data+'T00:00:00');var ini=new Date(mesAtual);ini.setDate(mesAtual.getDate()-mesAtual.getDay());var fim=new Date(ini);fim.setDate(ini.getDate()+6);return d>=ini&&d<=fim;});}
else if(view=='hoje'){var hoje=new Date().toISOString().slice(0,10);filtrados=eventos.filter(function(ev){return ev.data==hoje;});}
filtrados.sort(function(a,b){return a.data.localeCompare(b.data);});
var grupos={};filtrados.forEach(function(ev){if(!grupos[ev.data])grupos[ev.data]=[];grupos[ev.data].push(ev);});
var chaves=Object.keys(grupos).sort();
if(chaves.length==0){lista.innerHTML='<div style="text-align:center;padding:30px;color:#64748B">Nenhum evento em '+view+'<br><button class="btnPrimary" style="max-width:200px;margin-top:10px" onclick="setView(\'ano\')">VER ANO TODO</button></div>';document.getElementById('contador').innerText=eventos.length+' dias • v65.6 ULTRA - '+view;return;}
chaves.forEach(function(data){
var d=new Date(data+'T00:00:00');var titulo=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
lista.innerHTML+='<div class="dayHeader">'+titulo+'</div>';
grupos[data].forEach(function(ev){
var slotsHtml='';(ev.slots||[]).forEach(function(s){var label=s.tipo=='almoco'?'Almoço':'Janta';slotsHtml+='<div class="slot"><b>'+label+'</b><span>'+(s.inicio||'')+' - '+(s.fim||'')+'</span></div>';});
var qtd=ev.slots?ev.slots.length:1;var nomeCurto=getNomeCurto(ev);var nomes=(ev.musicos||[]).map(function(m){return m.nome}).join(' + ')||'Sem músico';
lista.innerHTML+='<div class="eventCard"><span class="badgeShows">'+qtd+' shows</span><div class="eventTitle">'+nomeCurto+'</div><div>'+slotsHtml+'</div><div class="eventSub">'+nomes+'<br><small>R$'+(ev.valor||0)+'</small></div><div class="eventActions"><button class="btnEdit" onclick="edita('+ev.id+')">Editar</button><button class="btnDel" onclick="exclui('+ev.id+')">Excluir</button></div></div>';
});
});
document.getElementById('contador').innerText=eventos.length+' dias • '+musicos.length+' músicos • v65.6 ULTRA - FUNCIONA • '+view;
}catch(e){
document.getElementById('lista').innerHTML='<div style="padding:20px;background:#FEE;color:#900">Erro: '+e.message+'<br><button class="btnPrimary" onclick="limparTudo()">LIMPAR TUDO E DESTRAVAR</button></div>';
}
}
function mudaMes(dir){mesAtual.setMonth(mesAtual.getMonth()+dir);render();}
function abreNovo(){editId=null;selMusicos=[];setProjeto('P1');document.getElementById('eData').value=mesAtual.toISOString().slice(0,10);renderMusEvento();document.getElementById('modEdit').classList.add('open');}
function edita(id){var ev=eventos.find(function(e){return e.id==id});if(!ev)return;editId=id;selMusicos=ev.musicos?ev.musicos.map(function(m){return m.id}):[];setProjeto(getNomeCurto(ev));document.getElementById('eData').value=ev.data;renderMusEvento();document.getElementById('modEdit').classList.add('open');}
function renderMusEvento(){var div=document.getElementById('listaMusicosEvento');var html='';musicos.forEach(function(m){var ch=selMusicos.includes(m.id)?'checked':'';var on=selMusicos.includes(m.id)?'on':'';html+='<label class="musCheck '+on+'"><div><input type="checkbox" '+ch+' onchange="toggleM('+m.id+')"><span style="margin-left:6px;font-weight:700">'+m.nome+'</span></div><span style="color:#2563EB;font-weight:800">R$ '+m.valor+'</span></label>'});div.innerHTML=html;calc();}
function toggleM(id){if(selMusicos.includes(id))selMusicos=selMusicos.filter(function(x){return x!=id});else selMusicos.push(id);renderMusEvento();}
function calc(){var qtd=(document.getElementById('chkAlmoco').checked?1:0)+(document.getElementById('chkJanta').checked?1:0);if(qtd==0)qtd=1;var total=0;selMusicos.forEach(function(id){var m=musicos.find(function(x){return x.id==id});if(m)total+=parseFloat(m.valor)||0});var geral=total*qtd;document.getElementById('txtShows').innerText=qtd+' shows';document.getElementById('totalCache').innerText='R$ '+geral;return {geral:geral}}
function setProjeto(p){projetoAtual=p;document.querySelectorAll('.projBtn').forEach(function(b){b.classList.remove('active')});var el=document.getElementById('btn'+p);if(el)el.classList.add('active');}
function salva(){
var data=document.getElementById('eData').value;
if(!data){alert('Escolhe DATA');return}
var slots=[];
if(document.getElementById('chkAlmoco').checked)slots.push({tipo:'almoco',inicio:document.getElementById('eIniA').value||'12:30',fim:document.getElementById('eFimA').value||'15:30'});
if(document.getElementById('chkJanta').checked)slots.push({tipo:'janta',inicio:document.getElementById('eIniJ').value||'19:00',fim:document.getElementById('eFimJ').value||'22:00'});
if(slots.length==0){alert('Marca almoço ou janta');return}
var c=calc();var geral=c.geral;var listaMus=[];selMusicos.forEach(function(id){var m=musicos.find(function(x){return x.id==id});if(m)listaMus.push(m)});
if(editId){var ev=eventos.find(function(e){return e.id==editId});ev.data=data;ev.casa=projetoAtual;ev.projeto=projetoAtual;ev.slots=slots;ev.valor=geral;ev.musicos=listaMus;}
else{eventos.push({id:Date.now(),data:data,[STRIPPED]
closeM('modEdit');render();
}
function exclui(id){if(!confirm('Excluir?'))return;eventos=eventos.filter(function(e){return e.id!=id});render();}
function isDataLine(l){var u=l.toUpperCase().trim();return (u.includes("-FEIRA")||u.includes("SÁBADO")||u.includes("SABADO")||u.includes("DOMINGO"))&&u.includes(" DE ")&&u.includes("202");}
function getTexto(comValor){
var filtrados=eventos;var txt='';var grupos={};filtrados.forEach(function(ev){if(!grupos[ev.data])grupos[ev.data]=[];grupos[ev.data].push(ev)});
Object.keys(grupos).sort().forEach(function(data){
var d=new Date(data+'T00:00:00');txt+=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()+'\n';
grupos[data].forEach(function(ev){
var nomeCurto=getNomeCurto(ev);
(ev.slots||[]).forEach(function(s){
var label=s.tipo=='almoco'?'ALMOÇO':'JANTA';
var musTxt=(ev.musicos||[]).map(function(m){return m.nome}).join(' + ');
if(comValor){var mv=(ev.musicos||[]).map(function(m){return m.nome+' R$'+m.valor}).join(' + ');txt+=label+': '+nomeCurto+' - '+mv+' - '+s.inicio+'-'+s.fim+' = R$'+ev.valor+'\n';}
else{txt+=label+': '+nomeCurto+' - '+musTxt+' - '+s.inicio+'-'+s.fim+'\n';}
});
txt+='\n';
});
});return txt;
}
function exportNormal(comValor){
var t=getTexto(comValor);var titulo=comValor?'CRONOGRAMA COM VALOR':'CRONOGRAMA SEM VALOR';var linhas=t.split('\n');var htmlLinhas='';linhas.forEach(function(l){if(isDataLine(l)){htmlLinhas+='<div style="font-weight:900;font-size:16px;color:#1E3A8A;margin:20px 0 8px 0;padding:10px 14px;background:#EFF6FF;border-left:5px solid #2563EB;border-radius:8px;">'+l+'</div>';}else if(l.trim()==''){htmlLinhas+='<div style="height:8px"></div>';}else{htmlLinhas+='<div style="padding:3px 0 3px 14px;font-size:13.5px">'+l+'</div>';}});
var w=window.open('','','width=800,height=700');w.document.write('<html><head><meta charset="UTF-8"><title>'+titulo+'</title><style>body{font-family:Arial,sans-serif;padding:24px;line-height:1.7}h2{text-align:center;color:#1E3A8A;font-weight:800} @media print{button{display:none}} </style></head><body><h2>'+titulo+'</h2><div style="margin-top:16px">'+htmlLinhas+'</div><div style="text-align:center;margin-top:24px"><button onclick="window.print()" style="padding:14px 28px;background:#1E3A8A;color:#fff;border:none;border-radius:10px;font-weight:800">IMPRIMIR</button></div></body></html>');w.document.close();
}
function exportZap(comValor){
var t=getTexto(comValor);var linhas=t.split('\n');var tBold='';linhas.forEach(function(l){if(isDataLine(l)){tBold+='*'+l+'*\\n';}else{tBold+=l+'\\n';}});
var titulo=comValor?'*AGENDA TAKI SOM - COM VALOR*':'*CRONOGRAMA MÚSICO - SEM VALOR*';var msg=titulo+'\\n\\n'+tBold;window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}

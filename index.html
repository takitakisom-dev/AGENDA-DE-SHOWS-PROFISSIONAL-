<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI v66.1 FINAL - EDILL MUSICO - P1-P6</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#F1F5F9;font-family:Arial,sans-serif;padding-bottom:90px}
.top{position:sticky;top:0;z-index:100;background:#1E3A8A;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.card{background:#fff;margin:10px;border-radius:14px;padding:14px;text-align:center;font-weight:800;border:1px solid #E2E8F0}
.filtros{display:flex;gap:6px;justify-content:center;margin:10px;flex-wrap:wrap}.filtros button{padding:8px 14px;border-radius:20px;border:1px solid #E2E8F0;background:#fff;font-weight:700;cursor:pointer}.filtros button.active{background:#2563EB;color:#fff}
.cont{background:#10B981;color:#fff;margin:10px;border-radius:10px;padding:10px;text-align:center;font-weight:800;font-size:12px}
.dia{background:#1E3A8A;color:#fff;padding:10px 14px;border-radius:10px;margin:14px 10px 8px;font-weight:800;font-size:12px}
.ev{background:#fff;margin:0 10px 10px;border-radius:14px;padding:12px;border:1px solid #E2E8F0}
.plus{position:fixed;bottom:85px;right:14px;width:56px;height:56px;background:#2563EB;color:#fff;border:none;border-radius:16px;font-size:28px;cursor:pointer;z-index:90}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;gap:8px;padding:12px;border-top:1px solid #E2E8F0;z-index:200}
.bottom button{flex:1;padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;background:#F1F5F9}
.bottom button.zap{background:#1E3A8A;color:#fff}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:500;padding:14px}.modal.open{display:flex}
.box{background:#fff;border-radius:16px;width:100%;max-width:500px;padding:18px;max-height:90vh;overflow:auto}
.inp{width:100%;padding:11px;border:1px solid #E2E8F0;border-radius:10px;margin:6px 0}
.btn{width:100%;padding:12px;border:none;border-radius:10px;font-weight:800;background:#2563EB;color:#fff;cursor:pointer;margin-top:8px}
.btn2{width:100%;padding:11px;border:1px solid #E2E8F0;border-radius:10px;background:#fff;cursor:pointer;margin-top:6px}
.mus{display:flex;justify-content:space-between;padding:10px;border:1px solid #E2E8F0;border-radius:10px;margin:4px 0;cursor:pointer}
.mus.on{background:#EFF6FF;border-color:#2563EB}
.proj{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.proj button{flex:1;min-width:60px;padding:10px;border:1px solid #E2E8F0;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}.proj button.active{background:#2563EB;color:#fff}
</style>
</head>
<body>
<div class="top"><b>TAKI v66.1 - P1-P6 | EDILL MUSICO</b><button onclick="if(confirm('Limpar tudo?')){localStorage.clear();location.reload()}" style="background:#fff;color:#C00;border:none;padding:6px 12px;border-radius:20px;font-weight:800;font-size:11px">LIMPAR</button></div>
<div class="card">RESTAURANTES: P1 P2 P3 P4 P5 P6 | EDILL É MÚSICO!</div>
<div class="filtros"><button id="fSemana" class="active" onclick="setView('semana')">Semana</button><button id="fMes" onclick="setView('mes')">Mês</button><button id="fAno" onclick="setView('ano')">Ano Todo</button></div>
<div class="cont" id="contador">Carregando...</div>
<div id="lista"></div>
<button class="plus" onclick="novo()">+</button>
<div class="bottom"><button class="zap" onclick="zap(true)">ZAP COM VALOR - NEGRITO TOTAL</button><button class="zap" style="background:#059669" onclick="zap(false)">ZAP SEM VALOR - NEGRITO TOTAL</button></div>
<div class="modal" id="modEdit"><div class="box">
<b id="tit">Novo Show - Adicionar Cronograma</b><br><br>
<input id="eData" type="date" class="inp">
<label style="font-weight:800;font-size:12px;margin-top:8px;display:block">RESTAURANTE:</label>
<div class="proj">
<button id="bP1" class="active" onclick="setProj('P1')">P1</button>
<button id="bP2" onclick="setProj('P2')">P2</button>
<button id="bP3" onclick="setProj('P3')">P3</button>
<button id="bP4" onclick="setProj('P4')">P4</button>
<button id="bP5" onclick="setProj('P5')">P5</button>
<button id="bP6" onclick="setProj('P6')">P6</button>
</div>
<div style="border:1px solid #E2E8F0;border-radius:10px;padding:10px;margin:8px 0"><label><input type="checkbox" id="chkA" onchange="calc()"> Almoço</label> <input id="iA" type="time" value="12:30"> - <input id="fA" type="time" value="15:30"></div>
<div style="border:1px solid #E2E8F0;border-radius:10px;padding:10px;margin:8px 0"><label><input type="checkbox" id="chkJ" checked onchange="calc()"> Janta</label> <input id="iJ" type="time" value="19:00"> - <input id="fJ" type="time" value="22:00"></div>
<label style="font-weight:800;font-size:12px;margin-top:8px;display:block">MÚSICO (EDILL AQUI!):</label>
<div id="listaMus" style="max-height:200px;overflow:auto"></div>
<div style="background:#1E3A8A;color:#fff;padding:10px;border-radius:10px;margin-top:10px;display:flex;justify-content:space-between;font-weight:800"><span id="txtQ">1 show</span><span id="txtV">R$ 0</span></div>
<button class="btn" onclick="salva()">Salvar Show</button>
<button class="btn2" onclick="closeM()">Cancelar</button>
</div></div>
<script>
var padrao=[
{casa:"P1",id:1,data:"2026-10-19",slots:[{tipo:"janta",ini:"19:00",fim:"22:00"}],mus:"ANDERSON VAT 60 DUO",val:400},
{casa:"P2",id:2,data:"2026-10-19",slots:[{tipo:"janta",ini:"19:00",fim:"22:00"}],mus:"RICK DUO",val:400},
{casa:"P3",id:3,data:"2026-10-19",slots:[{tipo:"janta",ini:"19:00",fim:"22:00"}],mus:"RICK SOLO",val:300},
{casa:"P4",id:4,data:"2026-10-19",slots:[{tipo:"janta",ini:"19:00",fim:"22:00"}],mus:"RICK SOLO",val:300},
{casa:"P5",id:5,data:"2026-10-19",slots:[{tipo:"janta",ini:"19:00",fim:"22:00"}],mus:"EDILL",val:300},
{casa:"P6",id:6,data:"2026-10-19",slots:[{tipo:"janta",ini:"19:00",fim:"22:00"}],mus:"MARTIN",val:300}
];
var musicos=[
{nome:"ANDERSON VAT 60 DUO",val:400},{nome:"ANDERSON VAT 60 TRIO",val:450},{nome:"ANDRÉ",val:300},{nome:"DOUGLAS",val:300},{nome:"EDILL",val:300},{nome:"GERVÁSIO",val:200},{nome:"ISRAEL",val:300},{nome:"LUCIANO",val:300},{nome:"MARTIN",val:300},{nome:"RICK DUO",val:400},{nome:"RICK SOLO",val:300},{nome:"RICK TRIO",val:450},{nome:"ROBSON SOLO",val:300},{nome:"YGOR",val:300}
];
var KEY="TAKI_V66_1_P1P6_EDILL_MUSICO";
var eventos=[];
try{var r=localStorage.getItem(KEY);if(r){var j=JSON.parse(r);if(j&&j.length>0)eventos=j;else eventos=padrao.slice();}else eventos=padrao.slice();}catch(e){eventos=padrao.slice();}
var view="semana";var projAtual="P1";var editId=null;var selMus=[];
function setProj(p){projAtual=p;document.querySelectorAll('.proj button').forEach(function(b){b.classList.remove('active')});document.getElementById('b'+p).classList.add('active');}
function setView(v){view=v;document.querySelectorAll('.filtros button').forEach(function(b){b.classList.remove('active')});var id="f"+v.charAt(0).toUpperCase()+v.slice(1);var el=document.getElementById(id);if(el)el.classList.add('active');render();}
function save(){if(eventos.length>0)localStorage.setItem(KEY,JSON.stringify(eventos));}
function render(){
var lista=document.getElementById('lista');lista.innerHTML='';
var filt=eventos;
if(view=="mes")filt=eventos.filter(function(e){return e.data.startsWith("2026-10");});
else if(view=="semana")filt=eventos.filter(function(e){return e.data>="2026-10-19"&&e.data<="2026-10-25";});
var grupos={};filt.forEach(function(e){if(!grupos[e.data])grupos[e.data]=[];grupos[e.data].push(e);});
Object.keys(grupos).sort().forEach(function(data){
var d=new Date(data+"T00:00:00");var tit=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
lista.innerHTML+='<div class="dia">'+tit+'</div>';
grupos[data].forEach(function(ev){
var slotsHtml="";ev.slots.forEach(function(s){slotsHtml+='<div style="background:#F8FAFC;padding:6px 10px;border-radius:8px;margin:3px 0;font-size:12px"><b>'+(s.tipo=="almoco"?"ALMOÇO":"JANTA")+'</b> '+s.ini+' - '+s.fim+'</div>';});
lista.innerHTML+='<div class="ev"><div style="font-weight:800;color:#1E3A8A">RESTAURANTE: '+ev.casa+' | MÚSICO: '+ev.mus+'</div>'+slotsHtml+'<div style="background:#EFF6FF;padding:8px;border-radius:8px;margin-top:6px;font-weight:700;font-size:12px">R$ '+ev.val+'</div><div style="display:flex;gap:8px;margin-top:8px"><button onclick="edita('+ev.id+')" style="flex:1;padding:8px;border:1px solid #E2E8F0;border-radius:8px;font-weight:700">Editar</button><button onclick="exclui('+ev.id+')" style="flex:1;padding:8px;border:1px solid #E2E8F0;border-radius:8px;font-weight:700">Excluir</button></div></div>';
});
});
if(filt.length==0)lista.innerHTML='<div style="text-align:center;padding:20px;color:#64748B">Nenhum evento em '+view+'<br><button onclick="setView(\'ano\')" style="margin-top:10px;padding:10px 20px;background:#2563EB;color:#fff;border:none;border-radius:10px">Ver Ano Todo - '+eventos.length+' eventos</button></div>';
document.getElementById('contador').innerHTML=filt.length+' eventos em '+view.toUpperCase()+' | Total '+eventos.length+' | RESTAURANTES P1-P6 | EDILL É MÚSICO!';
}
function novo(){editId=null;selMus=[];projAtual="P1";setProj("P1");document.getElementById('eData').value="2026-10-19";document.getElementById('chkA').checked=false;document.getElementById('chkJ').checked=true;renderMus();document.getElementById('modEdit').classList.add('open');}
function edita(id){var ev=eventos.find(function(e){return e.id==id});if(!ev)return;editId=id;projAtual=ev.casa;setProj(ev.casa);document.getElementById('eData').value=ev.data;selMus=[ev.mus];renderMus();document.getElementById('modEdit').classList.add('open');}
function renderMus(){var div=document.getElementById('listaMus');var h="";musicos.forEach(function(m){var on=selMus.includes(m.nome)?"on":"";var ch=selMus.includes(m.nome)?"checked":"";h+='<label class="mus '+on+'"><div><input type="checkbox" '+ch+' onchange="toggleMus(\''+m.nome+'\')"><span style="margin-left:6px;font-weight:700">'+m.nome+'</span></div><span style="color:#2563EB;font-weight:800">R$ '+m.val+'</span></label>';});div.innerHTML=h;calc();}
function toggleMus(nome){selMus=[nome];renderMus();}
function calc(){var qtd=(document.getElementById('chkA').checked?1:0)+(document.getElementById('chkJ').checked?1:0);if(qtd==0)qtd=1;var total=0;selMus.forEach(function(n){var m=musicos.find(function(x){return x.nome==n});if(m)total+=m.val;});var geral=total*qtd;document.getElementById('txtQ').innerText=qtd+" shows";document.getElementById('txtV').innerText="R$ "+geral;return geral;}
function closeM(){document.getElementById('modEdit').classList.remove('open');}
function salva(){
var data=document.getElementById('eData').value;
if(!data){alert('Escolhe data');return;}
var slots=[];
if(document.getElementById('chkA').checked)slots.push({tipo:"almoco",ini:document.getElementById('iA').value,fim:document.getElementById('fA').value});
if(document.getElementById('chkJ').checked)slots.push({tipo:"janta",ini:document.getElementById('iJ').value,fim:document.getElementById('fJ').value});
if(slots.length==0){alert('Marca almoço ou janta');return;}
if(selMus.length==0){alert('Escolhe músico - EDILL tá na lista!');return;}
var geral=calc();
if(editId){var ev=eventos.find(function(e){return e.id==editId});ev.data=data;ev.casa=projAtual;ev.slots=slots;ev.mus=selMus[0];ev.val=geral;}
else{eventos.push({id:Date.now(),data:data,[STRIPPED]
save();closeM();render();
}
function exclui(id){if(!confirm('Excluir?'))return;eventos=eventos.filter(function(e){return e.id!=id});save();render();}
function isDataLine(l){var u=l.toUpperCase();return (u.includes("-FEIRA")||u.includes("SÁBADO")||u.includes("SABADO")||u.includes("DOMINGO"))&&u.includes(" DE ");}
function zap(comValor){
var grupos={};eventos.forEach(function(ev){if(!grupos[ev.data])grupos[ev.data]=[];grupos[ev.data].push(ev);});
var txt="";
Object.keys(grupos).sort().forEach(function(data){
var d=new Date(data+"T00:00:00");txt+=d.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()+"\n";
grupos[data].forEach(function(ev){
ev.slots.forEach(function(s){
var label=s.tipo=="almoco"?"ALMOÇO":"JANTA";
if(comValor)txt+=label+": RESTAURANTE "+ev.casa+" - MÚSICO "+ev.mus+" R$"+ev.val+" - "+s.ini+"-"+s.fim+" = R$"+ev.val+"\n";
else txt+=label+": RESTAURANTE "+ev.casa+" - MÚSICO "+ev.mus+" - "+s.ini+"-"+s.fim+"\n";
});
txt+="\n";
});
});
var linhas=txt.split("\n");var bold="";linhas.forEach(function(l){if(isDataLine(l))bold+="*"+l+"*\n";else bold+=l+"\n";});
var titulo=comValor?"*AGENDA TAKI SOM - COM VALOR*":"*CRONOGRAMA - SEM VALOR*";
var msg=titulo+"\n\n"+bold;
window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank");
}
render();
</script>
</body>
</html>

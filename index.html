<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TAKI SOM - v70 SIMPLES</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}body{background:#F1F5F9;font-family:Arial,sans-serif;padding-bottom:90px}
.top{background:#1E3A8A;color:#fff;padding:14px;text-align:center;font-weight:800;font-size:18px;position:sticky;top:0;z-index:100}
.card{background:#fff;margin:10px;border-radius:14px;padding:14px;border:1px solid #E2E8F0}
.filtros{display:flex;gap:6px;justify-content:center;margin:10px}.filtros button{padding:8px 14px;border-radius:20px;border:1px solid #E2E8F0;background:#fff;font-weight:700;cursor:pointer}.filtros button.ativo{background:#2563EB;color:#fff}
.cont{background:#10B981;color:#fff;margin:10px;border-radius:10px;padding:10px;text-align:center;font-weight:800}
.dia{background:#1E3A8A;color:#fff;padding:8px 12px;border-radius:8px;margin:12px 10px 6px;font-weight:800;font-size:12px}
.ev{background:#fff;margin:0 10px 10px;border-radius:12px;padding:12px;border:1px solid #E2E8F0}
.ev b{color:#1E3A8A}
.btnPlus{position:fixed;bottom:80px;right:14px;width:56px;height:56px;background:#2563EB;color:#fff;border:none;border-radius:16px;font-size:28px;cursor:pointer;z-index:50}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;gap:8px;padding:10px;border-top:1px solid #E2E8F0}
.bottom button{flex:1;padding:12px;border:none;border-radius:10px;font-weight:800;color:#fff;cursor:pointer}
.b1{background:#1E3A8A}.b2{background:#059669}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;z-index:200;padding:14px}.modal.aberto{display:flex}
.box{background:#fff;border-radius:14px;padding:16px;width:100%;max-width:400px;max-height:85vh;overflow:auto}
.inp{width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:8px;margin:5px 0}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-weight:800;background:#2563EB;color:#fff;margin-top:8px;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin:8px 0}.grid button{padding:10px;border:1px solid #E2E8F0;border-radius:8px;background:#fff;font-weight:700;cursor:pointer}.grid button.on{background:#2563EB;color:#fff}
.musicos{max-height:150px;overflow:auto;border:1px solid #E2E8F0;border-radius:8px;padding:6px;margin:8px 0}.musicos label{display:flex;justify-content:space-between;padding:8px;border-radius:6px;margin:3px 0;cursor:pointer}.musicos label.sel{background:#EFF6FF;border:1px solid #2563EB}
</style>
</head>
<body>
<div class="top">TAKI SOM - v70 SIMPLES - FUNCIONA</div>
<div class="card" style="background:#FEF2F2;border-color:#FECACA;color:#991B1B;font-size:12px;text-align:center"><b>SE TRAVAR: Chrome 3 pontinhos > Configurações do site > Limpar dados > Recarregar</b></div>
<div class="filtros"><button id="bSemana" class="ativo" onclick="ver('semana')">Semana</button><button id="bMes" onclick="ver('mes')">Mês</button><button id="bAno" onclick="ver('ano')">Ano Todo</button></div>
<div class="cont" id="contador">15 eventos - P1 a P6 - EDILL MUSICO</div>
<div id="lista"></div>
<button class="btnPlus" onclick="novo()">+</button>
<div class="bottom"><button class="b1" onclick="zap(true)">ZAP COM VALOR - NEGRITO TOTAL</button><button class="b2" onclick="zap(false)">ZAP SEM VALOR - NEGRITO TOTAL</button></div>
<div class="modal" id="modal"><div class="box">
<b id="titulo">Novo Show</b><br><br>
Data: <input id="data" type="date" class="inp" value="2026-10-19">
<div style="font-weight:800;margin-top:8px;font-size:12px">RESTAURANTE - P1 a P6:</div>
<div class="grid">
<button id="pP1" class="on" onclick="selP('P1')">P1</button><button id="pP2" onclick="selP('P2')">P2</button><button id="pP3" onclick="selP('P3')">P3</button><button id="pP4" onclick="selP('P4')">P4</button><button id="pP5" onclick="selP('P5')">P5</button><button id="pP6" onclick="selP('P6')">P6</button>
</div>
<div style="font-weight:800;font-size:12px">TURNO:</div>
<label><input type="checkbox" id="almoco"> Almoço 12:30-15:30</label><br>
<label><input type="checkbox" id="janta" checked> Janta 19:00-22:00</label>
<div style="font-weight:800;font-size:12px;margin-top:8px">MÚSICO - EDILL ESTÁ AQUI:</div>
<div class="musicos" id="listaMus"></div>
<button class="btn" onclick="salvar()">Salvar</button>
<button class="btn" style="background:#fff;color:#64748B;border:1px solid #E2E8F0" onclick="fechar()">Cancelar</button>
</div></div>
<script>
var eventos=[
{id:1,data:"2026-10-19",casa:"P1",mus:"RICK SOLO",valor:300,turno:"Janta 19:00-22:00"},
{id:2,data:"2026-10-19",casa:"P2",mus:"ANDERSON VAT 60 DUO",valor:400,turno:"Janta 19:00-22:00"},
{id:3,data:"2026-10-19",casa:"P3",mus:"RICK DUO",valor:400,turno:"Janta 20:00-23:00"},
{id:4,data:"2026-10-19",casa:"P4",mus:"ROBSON SOLO",valor:300,turno:"Janta 20:30-23:30"},
{id:5,data:"2026-10-19",casa:"P5",mus:"GERVÁSIO",valor:200,turno:"Janta 19:00-22:00"},
{id:6,data:"2026-10-19",casa:"P6",mus:"EDILL",valor:300,turno:"Janta 19:00-22:00"},
{id:7,data:"2026-10-20",casa:"P1",mus:"DOUGLAS",valor:300,turno:"Janta 19:00-22:00"},
{id:8,data:"2026-10-20",casa:"P2",mus:"LUCIANO",valor:300,turno:"Janta 19:00-22:00"},
{id:9,data:"2026-10-20",casa:"P3",mus:"ISRAEL",valor:300,turno:"Janta 20:00-23:00"},
{id:10,data:"2026-10-20",casa:"P4",mus:"MARTIN",valor:300,turno:"Janta 20:30-23:30"},
{id:11,data:"2026-10-21",casa:"P1",mus:"ANDERSON VAT 60 DUO",valor:400,turno:"Janta 19:00-22:00"},
{id:12,data:"2026-10-21",casa:"P2",mus:"RICK TRIO",valor:450,turno:"Janta 19:00-22:00"},
{id:13,data:"2026-10-21",casa:"P3",mus:"EDILL",valor:300,turno:"Janta 20:00-23:00"},
{id:14,data:"2026-10-21",casa:"P5",mus:"ANDRÉ",valor:300,turno:"Janta 19:00-22:00"},
{id:15,data:"2026-10-21",casa:"P6",mus:"YGOR",valor:300,turno:"Janta 19:00-22:00"}
];
var musicos=[
{nome:"ANDERSON VAT 60 DUO",valor:400},{nome:"ANDERSON VAT 60 TRIO",valor:450},{nome:"ANDRÉ",valor:300},{nome:"DOUGLAS",valor:300},{nome:"EDILL",valor:300},{nome:"GERVÁSIO",valor:200},{nome:"ISRAEL",valor:300},{nome:"LUCIANO",valor:300},{nome:"MARTIN",valor:300},{nome:"RICK DUO",valor:400},{nome:"RICK SOLO",valor:300},{nome:"RICK TRIO",valor:450},{nome:"ROBSON SOLO",valor:300},{nome:"YGOR",valor:300}
];
var vista="semana";var casaSel="P1";var musSel="";var editId=null;
function selP(p){casaSel=p;document.querySelectorAll('.grid button').forEach(function(b){b.classList.remove('on')});var el=document.getElementById('p'+p);if(el)el.classList.add('on');}
function ver(v){vista=v;document.querySelectorAll('.filtros button').forEach(function(b){b.classList.remove('ativo')});var el=document.getElementById('b'+v.charAt(0).toUpperCase()+v.slice(1));if(el)el.classList.add('ativo');if(v=='ano'){var el2=document.getElementById('bAno');if(el2)el2.classList.add('ativo');}mostra();}
function mostra(){
 var lista=document.getElementById('lista');var filt=eventos;
 if(vista=='semana') filt=eventos.filter(function(e){return e.data>='2026-10-19' && e.data<='2026-10-25';});
 else if(vista=='mes') filt=eventos.filter(function(e){return e.data.indexOf('2026-10')==0;});
 else filt=eventos;
 filt.sort(function(a,b){return a.data.localeCompare(b.data);});
 var grupos={};filt.forEach(function(e){if(!grupos[e.data])grupos[e.data]=[];grupos[e.data].push(e);});
 var html='';Object.keys(grupos).sort().forEach(function(d){
  var dt=new Date(d+'T00:00:00');var tit=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase();
  html+='<div class="dia">'+tit+'</div>';
  grupos[d].forEach(function(ev){html+='<div class="ev"><b>'+ev.casa+' - '+ev.mus+'</b><br>'+ev.turno+'<br>R$ '+ev.valor+'<br><div style="margin-top:6px"><button onclick="editar('+ev.id+')" style="padding:6px 12px;border:1px solid #E2E8F0;border-radius:6px">Editar</button> <button onclick="excluir('+ev.id+')" style="padding:6px 12px;border:1px solid #E2E8F0;border-radius:6px">Excluir</button></div></div>';});
 });
 if(filt.length==0) html='<div class="card" style="text-align:center">Nenhum evento em '+vista+'<br><br><button onclick="ver(\'ano\')" style="padding:10px 20px;background:#2563EB;color:#fff;border:none;border-radius:8px">Ver Ano Todo - '+eventos.length+' eventos</button></div>';
 lista.innerHTML=html;
 document.getElementById('contador').innerText=filt.length+' eventos em '+vista.toUpperCase()+' | Total '+eventos.length+' eventos - P1-P6 - EDILL MUSICO - FUNCIONA!';
}
function novo(){editId=null;musSel="";casaSel="P1";selP("P1");document.getElementById('data').value="2026-10-19";document.getElementById('almoco').checked=false;document.getElementById('janta').checked=true;document.getElementById('titulo').innerText="Novo Show";renderMus();document.getElementById('modal').classList.add('aberto');}
function editar(id){var ev=eventos.find(function(e){return e.id==id;});if(!ev)return;editId=id;casaSel=ev.casa;musSel=ev.mus;selP(ev.casa);document.getElementById('data').value=ev.data;document.getElementById('titulo').innerText="Editar Show";renderMus();document.getElementById('modal').classList.add('aberto');}
function renderMus(){var div=document.getElementById('listaMus');var h='';musicos.forEach(function(m){var sel=m.nome==musSel?'sel':'';var chk=m.nome==musSel?'checked':'';h+='<label class="'+sel+'"><span><input type="radio" name="mus" '+chk+' onchange="musSel=\''+m.nome.replace(/'/g,"\\'")+'\';renderMus()"> '+m.nome+'</span><span style="color:#2563EB;font-weight:800">R$ '+m.valor+'</span></label>';});div.innerHTML=h;}
function fechar(){document.getElementById('modal').classList.remove('aberto');}
function salvar(){
 var data=document.getElementById('data').value;if(!data){alert('Data');return;}if(!musSel){alert('Escolhe músico - EDILL tá na lista!');return;}
 var almoco=document.getElementById('almoco').checked;var janta=document.getElementById('janta').checked;var turno='';
 if(almoco && janta) turno='Almoço 12:30-15:30 + Janta 19:00-22:00';else if(almoco) turno='Almoço 12:30-15:30';else if(janta) turno='Janta 19:00-22:00';else turno='Janta 19:00-22:00';
 var m=musicos.find(function(x){return x.nome==musSel;});var valor=m?m.valor:300;
 if(editId){var ev=eventos.find(function(e){return e.id==editId;});ev.data=data;ev.casa=casaSel;ev.mus=musSel;ev.valor=valor;ev.turno=turno;}
 else{eventos.push({id:Date.now(),data:data,[STRIPPED]
 fechar();mostra();
}
function excluir(id){if(!confirm('Excluir?'))return;eventos=eventos.filter(function(e){return e.id!=id;});mostra();}
function isDataLine(l){var u=l.toUpperCase();return (u.indexOf("-FEIRA")>=0||u.indexOf("SÁBADO")>=0||u.indexOf("SABADO")>=0||u.indexOf("DOMINGO")>=0)&&u.indexOf(" DE ")>=0;}
function zap(comValor){
 var grupos={};eventos.forEach(function(e){if(!grupos[e.data])grupos[e.data]=[];grupos[e.data].push(e);});
 var txt='';Object.keys(grupos).sort().forEach(function(d){
  var dt=new Date(d+'T00:00:00');txt+=dt.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'}).toUpperCase()+'\n';
  grupos[d].forEach(function(ev){
   if(comValor) txt+='RESTAURANTE '+ev.casa+' - MÚSICO '+ev.mus+' R$'+ev.valor+' - '+ev.turno+' = R$'+ev.valor+'\n';
   else txt+='RESTAURANTE '+ev.casa+' - MÚSICO '+ev.mus+' - '+ev.turno+'\n';
  });txt+='\n';
 });
 var linhas=txt.split('\n');var bold='';linhas.forEach(function(l){if(isDataLine(l))bold+='*'+l+'*\n';else bold+=l+'\n';});
 var titulo=comValor?'*AGENDA TAKI SOM - COM VALOR*':'*CRONOGRAMA - SEM VALOR*';
 var msg=titulo+'\n\n'+bold;
 window.open('https://wa.me/?text='+encodeURIComponent(msg),'_blank');
}
mostra();
</script>
</body>
</html>

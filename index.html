<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1E40AF">
<title>TAKI SOM v109 - Completa Final</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif}
body{background:#f1f5f9;padding-bottom:90px}
.header{background:#1E40AF;color:white;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;border-radius:0 0 24px 24px;position:sticky;top:0;z-index:10}
.header h1{font-size:22px;font-weight:800;letter-spacing:1px}
.badge{position:absolute;top:-6px;right:-6px;background:#ef4444;color:white;font-size:11px;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:bold}
.card{background:white;margin:12px;border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,0.06)}
.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-nav button{width:44px;height:44px;border-radius:12px;border:1px solid #e2e8f0;background:#f8fafc;font-size:18px;font-weight:bold;color:#1E40AF}
.month-nav span{font-weight:800;font-size:14px;text-transform:uppercase;text-align:center;flex:1}
.filters-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px}
.filters-3 button{padding:12px 6px;border-radius:14px;border:1px solid #dbeafe;font-weight:700;font-size:12px;background:#eff6ff;color:#1e293b;line-height:1.2}
.filters-3 button.active{background:#2563eb;color:white;border-color:#2563eb}
.filters-row{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.filters-row button{white-space:nowrap;padding:10px 14px;border-radius:20px;border:1px solid #e2e8f0;background:white;font-size:13px;font-weight:600;color:#475569}
.filters-row button.active{background:#2563eb;color:white;border-color:#2563eb}
.banner{background:#16a34a;color:white;padding:10px 14px;display:flex;justify-content:space-between;font-weight:700;font-size:13px;margin:12px 12px 0 12px;border-radius:12px 12px 0 0}
.banner-blue{background:#2563eb;color:white;padding:10px 14px;margin:0 12px;font-weight:700;font-size:13px}
.event{background:white;margin:0 12px 10px 12px;padding:14px;border-radius:0 0 12px 12px;box-shadow:0 1px 4px rgba(0,0,0,0.05)}
.event b{font-size:15px;color:#0f172a}
.event small{color:#64748b;font-size:13px;display:block;margin:6px 0 10px 0}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.actions button{padding:10px;border-radius:10px;font-weight:700;font-size:13px;border:1px solid;background:white}
.btn-edit{border-color:#93c5fd!important;color:#2563eb}
.btn-del{border-color:#fecaca!important;color:#dc2626}
.empty{background:white;margin:0 12px;padding:28px 14px;text-align:center;border-radius:0 0 12px 12px;color:#64748b}
.empty button{margin-top:12px;padding:10px 18px;border-radius:20px;border:none;background:#2563eb;color:white;font-weight:700}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #e2e8f0;display:flex;justify-content:space-around;padding:12px 0 18px 0;z-index:20}
.bottom-nav span{font-size:14px;font-weight:600;color:#94a3b8}
.bottom-nav span.active{color:#2563eb}
.fab{position:fixed;bottom:78px;right:18px;width:56px;height:56px;background:#2563eb;color:white;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 4px 12px rgba(37,99,235,0.4);z-index:19;border:none}
</style>
</head>
<body>

<div class="header">
<div>☰</div>
<h1>TAKI SOM</h1>
<div style="position:relative">🔔<div class="badge" id="badgeCount">0</div></div>
</div>

<div class="card">
<div class="month-nav">
<button onclick="mudarMes(-1)">‹</button>
<span id="mesLabel">MÊS DE OUTUBRO DE 2026</span>
<button onclick="mudarMes(1)">›</button>
</div>
<div class="filters-3">
<button id="btnDia" class="active" onclick="irParaHoje()">DIA <span id="diaNum">27</span><br>HOJE</button>
<button onclick="setFiltro('Mes')">MÊS<br><span id="mesNome">OUTUBRO</span></button>
<button onclick="setFiltro('Ano')">ANO<br><span id="anoNum">2026</span></button>
</div>
<div class="filters-row">
<button class="active" id="fHoje" onclick="setFiltro('Hoje')">Hoje</button>
<button id="fDia" onclick="setFiltro('Dia')">Dia</button>
<button id="fSemana" onclick="setFiltro('Semana')">Semana</button>
<button id="fMes" onclick="setFiltro('Mes')">Mês</button>
<button id="fAno" onclick="setFiltro('Ano')">Ano Todo</button>
</div>
</div>

<div class="banner"><span id="bannerCount">0 eventos</span><span id="bannerTipo">HOJE</span></div>
<div class="banner-blue" id="bannerBlue">HOJE - SEGUNDA, 27/10/2026</div>
<div id="listaEventos"></div>

<button class="fab" onclick="novoEvento()">+</button>
<div class="bottom-nav"><span class="active">Agenda</span><span>Músicos</span><span>Relatório</span><span>Menu</span></div>

<script>
// ===== TAKI SOM v109 - COMPLETA - SEM TRAVAR - FILTRO REAL =====
function getHojeReal(){
  const agora = new Date();
  return new Date(agora.getFullYear(), agora.getMonth(), agora.getDate());
}
let dataSelecionada = getHojeReal();
let mesVisualizado = new Date(dataSelecionada.getFullYear(), dataSelecionada.getMonth(), 1);
let filtroAtual = 'Hoje';

// Carrega eventos
let eventos = [];
try{
  const salvo = localStorage.getItem('takisom_final_eventos');
  if(salvo){
    eventos = JSON.parse(salvo);
    if(!Array.isArray(eventos)) eventos = [];
  }
}catch(e){ eventos = []; }

// Recupera eventos antigos sem data e joga pra 26/10 pra não perder
let precisaSalvar = false;
eventos = eventos.map(ev=>{
  if(!ev.data){
    precisaSalvar = true;
    return {...ev, data:'2026-10-26'};
  }
  return ev;
});
if(precisaSalvar) localStorage.setItem('takisom_final_eventos', JSON.stringify(eventos));

// Se ainda tá zerado, cria exemplo do dia 27
if(eventos.length===0){
  eventos = [
    {id:1, data:'2026-10-27', nome:'P1 - ISRAEL', horario:'Janta 19:00-22:00', valor:300},
    {id:2, data:'2026-10-27', nome:'P2 - YGOR', horario:'Janta 19:00-22:00', valor:300},
  ];
  localStorage.setItem('takisom_final_eventos', JSON.stringify(eventos));
}

function toISO(d){ return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function parseData(ev){
  let s = ev.data || '';
  if(!s) return null;
  if(s.includes('/')){
    const [dd,mm,yyyy] = s.split('/');
    if(yyyy && mm && dd) return `${yyyy}-${mm.padStart(2,'0')}-${dd.padStart(2,'0')}`;
    return null;
  }
  return s.substring(0,10);
}
function formatDateBR(d){ return `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`; }
function formatDiaSemana(d){ return ['DOMINGO','SEGUNDA','TERÇA','QUARTA','QUINTA','SEXTA','SÁBADO'][d.getDay()]; }
function formatMesExtenso(d){ return ['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'][d.getMonth()]; }

function getEventosFiltrados(){
  const isoHoje = toISO(getHojeReal());
  const isoSel = toISO(dataSelecionada);
  return eventos.filter(ev=>{
    const isoEv = parseData(ev);
    if(!isoEv) return false;
    const dEv = new Date(isoEv+'T12:00:00');
    if(filtroAtual==='Hoje') return isoEv===isoHoje;
    if(filtroAtual==='Dia') return isoEv===isoSel;
    if(filtroAtual==='Semana'){
      const ini = new Date(dataSelecionada);
      ini.setDate(dataSelecionada.getDate()-dataSelecionada.getDay());
      const fim = new Date(ini);
      fim.setDate(ini.getDate()+6);
      return isoEv>=toISO(ini) && isoEv<=toISO(fim);
    }
    if(filtroAtual==='Mes') return dEv.getMonth()===mesVisualizado.getMonth() && dEv.getFullYear()===mesVisualizado.getFullYear();
    if(filtroAtual==='Ano') return dEv.getFullYear()===mesVisualizado.getFullYear();
    return false;
  });
}

function irParaHoje(){
  dataSelecionada = getHojeReal();
  mesVisualizado = new Date(dataSelecionada.getFullYear(), dataSelecionada.getMonth(), 1);
  filtroAtual='Hoje';
  render();
}
function mudarMes(dir){
  mesVisualizado.setMonth(mesVisualizado.getMonth()+dir);
  dataSelecionada = new Date(mesVisualizado.getFullYear(), mesVisualizado.getMonth(), 1);
  if(filtroAtual!=='Mes' && filtroAtual!=='Ano') filtroAtual='Mes';
  render();
}
function setFiltro(f){
  filtroAtual=f;
  if(f==='Hoje') irParaHoje();
  else render();
}

function render(){
  const hojeReal = getHojeReal();
  document.getElementById('diaNum').innerText = hojeReal.getDate();
  document.getElementById('mesNome').innerText = formatMesExtenso(mesVisualizado);
  document.getElementById('anoNum').innerText = mesVisualizado.getFullYear();
  document.getElementById('mesLabel').innerText = `MÊS DE ${formatMesExtenso(mesVisualizado)} DE ${mesVisualizado.getFullYear()}`;
  document.getElementById('bannerBlue').innerText = `${filtroAtual.toUpperCase()} - ${formatDiaSemana(dataSelecionada)}, ${formatDateBR(dataSelecionada)}`;
  document.getElementById('bannerTipo').innerText = filtroAtual.toUpperCase();
  document.querySelectorAll('.filters-row button').forEach(b=>b.classList.remove('active'));
  const map={Hoje:'fHoje',Dia:'fDia',Semana:'fSemana',Mes:'fMes',Ano:'fAno'};
  if(map[filtroAtual]) document.getElementById(map[filtroAtual]).classList.add('active');

  const filtrados = getEventosFiltrados();
  const hojeCount = eventos.filter(ev=>parseData(ev)===toISO(hojeReal)).length;

  document.getElementById('bannerCount').innerText = `${filtrados.length} eventos - ${filtroAtual} ${formatDateBR(dataSelecionada)}`;
  document.getElementById('badgeCount').innerText = hojeCount;

  const lista = document.getElementById('listaEventos');
  if(filtrados.length===0){
    lista.innerHTML = `<div class="empty">Nenhum show para ${filtroAtual.toLowerCase()} em ${formatDateBR(dataSelecionada)}<br><br><button onclick="setFiltro('Mes')">Ver Mês de ${formatMesExtenso(mesVisualizado)}</button><br><br><button onclick="novoEvento()" style="background:#16a34a">+ Adicionar show hoje</button></div>`;
  } else {
    lista.innerHTML = filtrados.map(ev=>{
      let nome = ev.nome || ev.musico || ev.restaurante || 'Evento';
      let horario = ev.horario || 'Janta 19:00-22:00';
      let valor = ev.valor || ev.cache || 0;
      let dataBr = parseData(ev) ? formatDateBR(new Date(parseData(ev)+'T12:00:00')) : '';
      return `<div class="event"><b>${nome}</b><small>${horario} &nbsp; R$ ${valor} &nbsp; ${dataBr}</small><div class="actions"><button class="btn-edit" onclick="editarEvento(${ev.id})">Editar</button><button class="btn-del" onclick="excluirEvento(${ev.id})">Excluir</button></div></div>`;
    }).join('');
  }
}

function novoEvento(){
  const nome = prompt('Nome do músico / evento:');
  if(!nome) return;
  const valor = prompt('Valor R$:', '300');
  const novo = {id:Date.now(), data:toISO(dataSelecionada), nome:nome, horario:'Janta 19:00-22:00', valor:valor||300};
  eventos.push(novo);
  localStorage.setItem('takisom_final_eventos', JSON.stringify(eventos));
  render();
}
function editarEvento(id){
  const ev = eventos.find(e=>e.id===id);
  if(!ev) return;
  const novoNome = prompt('Editar nome:', ev.nome||ev.musico||'');
  if(novoNome===null) return;
  ev.nome = novoNome;
  ev.musico = novoNome;
  localStorage.setItem('takisom_final_eventos', JSON.stringify(eventos));
  render();
}
function excluirEvento(id){
  if(!confirm('Excluir este evento?')) return;
  eventos = eventos.filter(e=>e.id!==id);
  localStorage.setItem('takisom_final_eventos', JSON.stringify(eventos));
  render();
}

setInterval(()=>{
  const agoraReal = getHojeReal();
  if(toISO(agoraReal)!==toISO(dataSelecionada) && filtroAtual==='Hoje'){
    dataSelecionada = agoraReal;
    mesVisualizado = new Date(agoraReal.getFullYear(), agoraReal.getMonth(), 1);
    render();
  }
},60000);

render();
</script>
</body>
</html>

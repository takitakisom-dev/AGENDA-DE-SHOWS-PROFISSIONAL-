<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agenda do Dia</title>
<style>
:root{--bg:#f2f2f2;--card:#fff}
*{box-sizing:border-box;font-family:Inter,system-ui,Arial,sans-serif}
body{margin:0;background:var(--bg);padding-bottom:110px}
header{position:sticky;top:0;z-index:20;background:#e9e9e9;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #ddd}
header h1{margin:0;font-size:18px;font-weight:900}
.btn-home{background:#222;color:#fff;border:0;padding:8px 16px;border-radius:999px;font-weight:800}
.date-card{background:#fff;margin:12px;border-radius:18px;padding:14px;box-shadow:0 2px 8px rgba(0,0,0,.06);text-align:center}
.date-card .top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.arrow{width:56px;height:56px;border:0;border-radius:14px;background:#222;color:#fff;font-size:28px;display:grid;place-items:center}
.title-long{font-weight:900;font-size:18px;margin-bottom:8px}
input[type=date]{font-size:16px;padding:8px 12px;border:1px solid #ccc;border-radius:12px;max-width:220px;text-align:center}
.pills{margin-top:8px;display:flex;justify-content:center;gap:8px}
.pill{border:0;background:#eee;padding:6px 14px;border-radius:999px;font-weight:800;color:#999}
.show-card{background:#fff;margin:12px;border-radius:18px;padding:14px 16px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.line{font-weight:900;font-size:18px;margin-bottom:4px}
.line2{color:#555;font-size:18px;margin-bottom:10px}
.actions{display:flex;gap:10px}
.b-edit{border:0;background:#e3f0ff;color:#2a7fff;padding:8px 14px;border-radius:10px;font-weight:800}
.b-del{border:0;background:#ffe3e3;color:#d44;padding:8px 14px;border-radius:10px;font-weight:800}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;gap:8px;padding:10px;justify-content:space-around;z-index:20}
.bottom button{border:0;padding:12px 18px;border-radius:14px;font-weight:900}
.b-zap{background:#00e676}
.b-normal{background:#7c6cff;color:#fff}
.b-folha{background:#ffe066;border:2px dashed #000}
.b-pdf{background:#00bfa6;color:#fff}
.folha-view{display:none;padding:12px}
.folha-paper{background:#fff;background-image:repeating-linear-gradient(transparent,transparent 31px,#a9d4ff 31px,#a9d4ff 32px);border:2px solid #333;border-radius:8px;padding:16px 18px 16px 48px;position:relative;min-height:80vh}
.folha-paper:before{content:'';position:absolute;left:36px;top:0;bottom:0;width:2px;background:#ff7b7b}
.folha-paper h2{font-family:'Comic Sans MS','Segoe Script',cursive;font-weight:900;margin:0 0 12px 0}
.folha-item{font-family:'Comic Sans MS','Segoe Script',cursive;font-size:20px;line-height:32px;margin:0}
.add-btn{position:fixed;right:18px;bottom:90px;width:62px;height:62px;border-radius:50%;border:0;background:#222;color:#fff;font-size:36px;z-index:25}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:30;padding:16px}
.modal-box{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:420px}
.modal-box input{width:100%;padding:10px;border:1px solid #ccc;border-radius:10px;margin:6px 0;font-size:16px}
.modal-box button{width:100%;padding:12px;border:0;border-radius:12px;font-weight:900;margin-top:8px}
.save{background:#222;color:#fff}
.cancel{background:#eee}
</style>
</head>
<body>
<header>
<div style="display:flex;align-items:center;gap:12px"><span style="font-size:26px">☰</span><h1>🎤 AGENDA DO DIA</h1></div>
<button class="btn-home">HOME</button>
</header>
<div id="listView">
<div class="date-card">
<div class="title-long" id="titleLong">Hoje - 19 de outubro de 2026</div>
<div class="top">
<button class="arrow" onclick="mudaDia(-1)">◀</button>
<div>
<input type="date" id="inpDate" value="2026-10-19" onchange="render()">
<div class="pills"><button class="pill" onclick="hoje()">HOJE</button><button class="pill" onclick="amanha()">AMANHÃ</button></div>
</div>
<button class="arrow" onclick="mudaDia(1)">▶</button>
</div>
</div>
<div id="lista"></div>
</div>
<div id="folhaView" class="folha-view">
<div class="folha-paper">
<h2 id="folhaTitulo">Hoje - 19 de outubro de 2026 - 19/10/2026</h2>
<div id="folhaConteudo"></div>
</div>
</div>
<button class="add-btn" onclick="abrirModal()">+</button>
<div class="bottom">
<button class="b-zap" onclick="zap()">📱 ZAP</button>
<button class="b-normal" onclick="modoNormal()">🖨️ NORMAL</button>
<button class="b-folha" onclick="modoFolha()">📒 FOLHA</button>
<button class="b-pdf" onclick="window.print()">📄 PDF</button>
</div>
<div class="modal" id="modal">
<div class="modal-box">
<h3>Novo Show</h3>
<input id="mP" placeholder="P1, P2...">
<input id="mIni" type="time" value="19:00">
<input id="mFim" type="time" value="22:00">
<input id="mNome" placeholder="Nome - Ex: DOUGLAS">
<input id="mValor" type="number" placeholder="Valor - 300">
<button class="save" onclick="salvar()">SALVAR</button>
<button class="cancel" onclick="fecharModal()">CANCELAR</button>
</div>
</div>
<script>
let shows=JSON.parse(localStorage.getItem('shows_agenda')||'null')||[
{p:'P1',ini:'19:00',fim:'22:00',nome:'DOUGLAS',valor:300},
{p:'P2',ini:'19:00',fim:'22:00',nome:'LUCIANO',valor:300},
{p:'P3',ini:'19:30',fim:'22:30',nome:'ISRAEL',valor:300},
{p:'P4',ini:'20:30',fim:'23:30',nome:'Andre Taki',valor:300},
];
let editIdx=-1;
function formatLong(d){return d.toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});}
function save(){localStorage.setItem('shows_agenda',JSON.stringify(shows));}
function render(){
 const inp=document.getElementById('inpDate').value;
 const d=inp?new Date(inp+'T12:00:00'):new Date();
 document.getElementById('titleLong').innerText=`Hoje - ${formatLong(d)}`;
 document.getElementById('folhaTitulo').innerText=`Hoje - ${formatLong(d)} - ${d.toLocaleDateString('pt-BR')}`;
 const lista=document.getElementById('lista');lista.innerHTML='';
 shows.forEach((s,i)=>{
  const div=document.createElement('div');div.className='show-card';
  div.innerHTML=`<div class="line">🏠 ${s.p} — 🕓 ${s.ini} as ${s.fim}</div><div class="line2">🎤 ${s.nome} - R$ ${s.valor}</div><div class="actions"><button class="b-edit" onclick="editar(${i})">✏️ EDITAR</button><button class="b-del" onclick="excluir(${i})">🗑️ EXCLUIR</button></div>`;
  lista.appendChild(div);
 });
 document.getElementById('folhaConteudo').innerHTML=shows.map(s=>`<p class="folha-item">🏠 ${s.p} - ${s.ini} as ${s.fim} - 🎤 ${s.nome} - R$ ${s.valor}</p>`).join('');
}
function mudaDia(n){const inp=document.getElementById('inpDate');let d=new Date(inp.value+'T12:00:00');d.setDate(d.getDate()+n);inp.value=d.toISOString().slice(0,10);render();}
function hoje(){document.getElementById('inpDate').value=new Date().toISOString().slice(0,10);render();}
function amanha(){let d=new Date();d.setDate(d.getDate()+1);document.getElementById('inpDate').value=d.toISOString().slice(0,10);render();}
function modoFolha(){document.getElementById('listView').style.display='none';document.getElementById('folhaView').style.display='block';}
function modoNormal(){document.getElementById('listView').style.display='block';document.getElementById('folhaView').style.display='none';}
function zap(){const d=document.getElementById('titleLong').innerText;const txt=shows.map(s=>`🏠 ${s.p} - ${s.ini} as ${s.fim} - 🎤 ${s.nome} - R$ ${s.valor}`).join('\n');window.open(`https://wa.me/?text=${encodeURIComponent('🎤 '+d+'\n\n'+txt)}`,'_blank');}
function abrirModal(){document.getElementById('modal').style.display='flex';}
function fecharModal(){document.getElementById('modal').style.display='none';editIdx=-1;}
function salvar(){
 const o={p:document.getElementById('mP').value||'P',ini:document.getElementById('mIni').value,fim:document.getElementById('mFim').value,nome:document.getElementById('mNome').value||'SEM NOME',valor:document.getElementById('mValor').value||0};
 if(editIdx>=0)shows[editIdx]=o;else shows.push(o);
 save();render();fecharModal();
}
function editar(i){editIdx=i;const s=shows[i];document.getElementById('mP').value=s.p;document.getElementById('mIni').value=s.ini;document.getElementById('mFim').value=s.fim;document.getElementById('mNome').value=s.nome;document.getElementById('mValor').value=s.valor;abrirModal();}
function excluir(i){if(confirm('Excluir?')){shows.splice(i,1);save();render();}}
render();
</script>
</body>
</html>
